<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート 対策クイズ＆用語集（全500問）</title>
<style>
    * {
        box-sizing: border-box;
    }
    body {
        font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        background-color: #f0f2f5;
        color: #333333;
        margin: 0;
        padding: 20px 10px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
    }
    .container {
        background-color: #ffffff;
        width: 100%;
        max-width: 720px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        padding: 30px 25px;
    }
    .hidden {
        display: none !important;
    }
    h1 {
        color: #0056b3;
        text-align: center;
        margin-top: 0;
        font-size: 24px;
    }
    .subtitle {
        text-align: center;
        color: #555;
        font-size: 14px;
        margin-bottom: 25px;
        line-height: 1.6;
    }
    .section-title {
        font-size: 15px;
        font-weight: bold;
        color: #444;
        margin: 22px 0 10px 0;
        padding-left: 10px;
        border-left: 4px solid #007bff;
    }
    .btn {
        display: block;
        width: 100%;
        padding: 14px 18px;
        margin-bottom: 12px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
    }
    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .btn-primary {
        background-color: #007bff;
        color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
        background-color: #0056b3;
    }
    .btn-endless {
        background-color: #ff5722;
        color: #fff;
    }
    .btn-endless:hover:not(:disabled) {
        background-color: #e64a19;
    }
    .btn-test {
        background-color: #28a745;
        color: #fff;
    }
    .btn-test:hover:not(:disabled) {
        background-color: #1e7e34;
    }
    .btn-fulltest {
        background-color: #dc3545;
        color: #fff;
    }
    .btn-fulltest:hover:not(:disabled) {
        background-color: #bd2130;
    }
    .btn-glossary {
        background-color: #6f42c1;
        color: #fff;
    }
    .btn-glossary:hover:not(:disabled) {
        background-color: #59359a;
    }
    .btn-cat {
        background-color: #e9f2ff;
        color: #0056b3;
        border: 1px solid #b8daff;
    }
    .btn-cat:hover:not(:disabled) {
        background-color: #d0e4ff;
    }
    .btn-secondary {
        background-color: #6c757d;
        color: #fff;
    }
    .btn-secondary:hover:not(:disabled) {
        background-color: #545b62;
    }
    .btn-hint {
        background-color: #ffc107;
        color: #212529;
    }
    .btn-hint:hover:not(:disabled) {
        background-color: #e0a800;
    }
    .quiz-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0f2f5;
    }
    .badge {
        background-color: #007bff;
        color: #fff;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
    }
    .progress-text {
        font-size: 14px;
        font-weight: bold;
        color: #555;
    }
    .question-box {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 18px;
        font-size: 16px;
        font-weight: bold;
        line-height: 1.6;
        margin-bottom: 18px;
    }
    .btn-choice {
        display: block;
        width: 100%;
        padding: 13px 16px;
        margin-bottom: 10px;
        font-size: 15px;
        font-weight: bold;
        text-align: left;
        background-color: #ffffff;
        color: #007bff;
        border: 2px solid #007bff;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s;
    }
    .btn-choice:hover:not(:disabled) {
        background-color: #e9f2ff;
    }
    .btn-choice:disabled {
        cursor: default;
    }
    .hint-box {
        background-color: #fff8e1;
        border-left: 4px solid #ffc107;
        padding: 12px 15px;
        margin: 12px 0;
        border-radius: 4px;
        font-size: 14px;
        color: #664d03;
        line-height: 1.5;
    }
    .result-text {
        font-size: 17px;
        font-weight: bold;
        text-align: center;
        margin: 14px 0 8px 0;
    }
    .explanation-box {
        background-color: #eef6ff;
        border-left: 4px solid #007bff;
        padding: 14px 16px;
        margin: 12px 0 18px 0;
        border-radius: 4px;
        font-size: 14px;
        color: #1c3d5a;
        line-height: 1.65;
        white-space: pre-line;
    }
    .quiz-footer-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 15px;
    }
    .quiz-sub-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
    }
    /* テストモード用 */
    .test-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        background-color: #f8f9fa;
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid #dee2e6;
        margin-bottom: 15px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .timer-box {
        font-size: 16px;
        font-weight: bold;
        color: #dc3545;
        background: #fff;
        padding: 5px 12px;
        border-radius: 6px;
        border: 1px solid #dc3545;
    }
    .timer-warning {
        background-color: #dc3545;
        color: #fff;
    }
    .test-notice {
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 18px;
    }
    .test-item {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        background-color: #fafafa;
    }
    .test-q-title {
        font-size: 13px;
        font-weight: bold;
        color: #0056b3;
        margin-bottom: 6px;
    }
    .test-q-text {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 12px;
        line-height: 1.5;
    }
    .test-choice-label {
        display: block;
        padding: 9px 12px;
        margin-bottom: 6px;
        background-color: #ffffff;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
    .test-choice-label:hover {
        background-color: #f1f7ff;
    }
    .test-feedback {
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: bold;
    }
    .fb-correct {
        background-color: #d4edda;
        color: #155724;
    }
    .fb-wrong {
        background-color: #f8d7da;
        color: #721c24;
    }
    .test-result-summary {
        background-color: #e9f5ff;
        border: 2px solid #007bff;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        margin-bottom: 20px;
    }
    /* モーダル（用語集） */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.55);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 15px;
    }
    .modal-content {
        background-color: #ffffff;
        width: 100%;
        max-width: 680px;
        max-height: 85vh;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }
    .modal-header {
        padding: 16px 20px;
        background-color: #6f42c1;
        color: #ffffff;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .modal-header h2 {
        margin: 0;
        font-size: 18px;
    }
    .btn-close-modal {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 24px;
        cursor: pointer;
        line-height: 1;
    }
    .modal-search {
        padding: 12px 20px;
        border-bottom: 1px solid #eee;
        background-color: #f8f9fa;
    }
    .modal-search input {
        width: 100%;
        padding: 10px 14px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }
    .modal-body {
        padding: 15px 20px;
        overflow-y: auto;
        flex: 1;
    }
    .glossary-item {
        border-bottom: 1px solid #eee;
        padding: 12px 0;
    }
    .glossary-item:last-child {
        border-bottom: none;
    }
    .glossary-term {
        font-weight: bold;
        font-size: 15px;
        color: #222;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .glossary-tag {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 4px;
        color: #fff;
        font-weight: bold;
    }
    .tag-st { background-color: #007bff; }
    .tag-mg { background-color: #28a745; }
    .tag-tc { background-color: #fd7e14; }
    .glossary-desc {
        margin: 0;
        font-size: 13.5px;
        color: #555;
        line-height: 1.5;
    }
</style>
</head>
<body>

<div class="container">
    <!-- スタート画面 -->
    <div id="screen-start">
        <h1>IT未経験者に向けたWEBクイズゲーム</h1>
        <p class="subtitle" id="lbl-start-subtitle">全500問収録！学習スタイルや分野別に選んで学べます。</p>

        <div class="section-title">通常学習モード（1問ずつ解説＆ヒント付き）</div>
        <button class="btn btn-primary" onclick="startQuiz('normal')">🎯 全分野ランダム（10問チャレンジ）</button>
        <button class="btn btn-endless" onclick="startQuiz('endless')">🔥 全500問 エンドレスモード</button>

        <div class="section-title">分野別チャレンジ（各10問）</div>
        <button class="btn btn-cat" onclick="startQuiz('strategy')">🏢 ストラテジ系（経営・法務・戦略）</button>
        <button class="btn btn-cat" onclick="startQuiz('management')">📊 マネジメント系（開発・プロジェクト・運用）</button>
        <button class="btn btn-cat" onclick="startQuiz('technology')">💻 テクノロジ系（基礎理論・ネットワーク・セキュリティ）</button>

        <div class="section-title">模擬試験モード（ヒント・用語集なし）</div>
        <button class="btn btn-test" onclick="startTestMode(20, false)">📝 模擬テスト（全20問・時間制限なし）</button>
        <button class="btn btn-fulltest" onclick="startTestMode(100, true)">⏱️ 本格テスト（全100問・制限時間120分）</button>

        <div class="section-title">弱点克服・振り返り</div>
        <button class="btn btn-endless" onclick="startQuiz('weakness')">🎯 弱点克服モード（苦手な問題を優先出題）</button>
        <button class="btn btn-cat" onclick="openReviewScreen()">📋 全問題一覧・振り返り（検索・苦手フィルタ）</button>
        <button class="btn btn-secondary" onclick="resetQuizStats()">🗑️ 成績データをリセット</button>
        
        <div class="section-title">学習サポート</div>
        <button class="btn btn-glossary" id="btn-glossary-start" onclick="openGlossary()">📖 用語集を見る（検索対応）</button>
    </div>

    <!-- 通常クイズ画面 -->
    <div id="screen-quiz" class="hidden">
        <div class="quiz-header">
            <span class="badge" id="lbl-mode-badge">モード</span>
            <span class="progress-text" id="lbl-progress">第 1 問 / 全 10 問</span>
        </div>

        <div class="question-box" id="lbl-question">問題文</div>

        <div id="choices-container">
            <button class="btn-choice" onclick="selectChoice(0)">1.</button>
            <button class="btn-choice" onclick="selectChoice(1)">2.</button>
            <button class="btn-choice" onclick="selectChoice(2)">3.</button>
            <button class="btn-choice" onclick="selectChoice(3)">4.</button>
        </div>

        <div class="quiz-sub-btns">
            <button class="btn btn-hint" onclick="showHint()">💡 ヒントを見る</button>
            <button class="btn btn-glossary" onclick="openGlossary()">📖 用語集</button>
        </div>

        <div id="lbl-hint" class="hint-box hidden"></div>
        <div id="lbl-result" class="result-text"></div>
        <div id="lbl-explanation" class="explanation-box hidden"></div>

        <div class="quiz-footer-btns">
            <button class="btn btn-secondary" onclick="showStartScreen()">🏠 スタートへ戻る</button>
            <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()" disabled>次の問題へ</button>
        </div>
    </div>

    <!-- テストモード画面 -->
    <div id="screen-test" class="hidden">
        <div class="test-header-bar">
            <strong id="lbl-test-title">模擬テスト</strong>
            <div id="test-timer-bar" class="timer-box hidden">残り時間: <span id="lbl-test-timer">120:00</span></div>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-secondary" id="btn-test-quit-top" style="margin:0; padding:8px 12px; font-size:13px;" onclick="showStartScreen()">中断して戻る</button>
                <button class="btn btn-primary" id="btn-submit-test-top" style="margin:0; padding:8px 14px; font-size:13px;" onclick="gradeTestMode(false)">採点する</button>
                <button class="btn btn-secondary hidden" id="btn-test-back-top" style="margin:0; padding:8px 14px; font-size:13px;" onclick="showStartScreen()">スタートへ戻る</button>
            </div>
        </div>

        <div id="lbl-test-notice" class="test-notice"></div>
        <div id="test-result-area" class="test-result-summary hidden"></div>
        <div id="test-questions-container"></div>

        <button class="btn btn-primary" id="btn-submit-test" onclick="gradeTestMode(false)">✅ 回答を確定して採点する</button>
        <button class="btn btn-secondary hidden" id="btn-test-back" onclick="showStartScreen()">🏠 スタート画面へ戻る</button>
    </div>

    <!-- 終了画面 -->
    <div id="screen-end" class="hidden" style="text-align:center;">
        <h1 id="lbl-end-title">クイズ終了！</h1>
        <p id="lbl-final-score" style="font-size:18px; font-weight:bold; white-space:pre-line; margin:25px 0;"></p>
        <button class="btn btn-primary" onclick="showStartScreen()">🏠 スタート画面へ戻る</button>
    </div>
    
    <!-- 全問題一覧・振り返り画面 -->
    <div id="screen-review" class="hidden">
        <h1>📋 全問題一覧・振り返り</h1>
        <button class="btn btn-secondary" onclick="showStartScreen()" style="margin-bottom:12px;">🏠 スタート画面へ戻る</button>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
            <input type="text" id="input-review-search" placeholder="問題文・用語・解説で検索" oninput="renderReviewList()" style="flex:1; min-width:200px; padding:10px; border:1px solid #ccc; border-radius:6px;">
            <select id="select-review-filter" onchange="renderReviewList()" style="padding:10px; border:1px solid #ccc; border-radius:6px;">
                <option value="all">すべて</option>
                <option value="weak">苦手（正答率60%未満・不正解あり）</option>
                <option value="unanswered">未回答のみ</option>
            </select>
        </div>
        <div id="review-list-container"></div>
        <button class="btn btn-secondary" onclick="showStartScreen()">🏠 スタート画面へ戻る</button>
    </div>
</div>

<!-- 用語集モーダル -->
<div id="modal-glossary" class="modal-overlay hidden" onclick="if(event.target===this) closeGlossary()">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="lbl-glossary-title">ITパスポート頻出 用語集</h2>
            <button class="btn-close-modal" onclick="closeGlossary()">×</button>
        </div>
        <div class="modal-search">
            <input type="text" id="input-glossary-search" placeholder="用語・解説・分野名で検索（例：SLA、セキュリティ、ストラテジ）" oninput="filterGlossary()">
        </div>
        <div class="modal-body" id="glossary-list-container"></div>
    </div>
</div>

<script>
    // 全500問（手動作成問題・重複なし・全問異なる切り口）
    const quizList = [
        // ===== ストラテジ系（1〜175問） =====
        { question: "【ストラテジ】デジタル技術を活用してビジネスモデルや業務プロセス、組織文化などを変革し、競争上の優位性を確立することはどれですか？", choices: ["DX", "BCP", "CRM", "SCM"], correctIndex: 0, hint: "デジタルトランスフォーメーションの略称だよ。", explanation: "DX（Digital Transformation）は単なるIT化にとどまらず、デジタル技術で事業や組織そのものを変革して競争力を高める取り組みです。" },
        { question: "【ストラテジ】災害やシステム障害などの緊急事態に備え、損害を抑えながら重要業務を継続・早期復旧させるための計画はどれですか？", choices: ["BPR", "BCP", "CSR", "SLA"], correctIndex: 1, hint: "事業継続計画の英語略称だよ。", explanation: "BCP（Business Continuity Plan）は緊急時でも中核事業を継続・早期復旧できるように事前策定しておく計画です。" },
        { question: "【ストラテジ】自社の強み・弱みと外部環境の機会・脅威の4軸で現状を整理する分析手法はどれですか？", choices: ["3C分析", "PEST分析", "SWOT分析", "RFM分析"], correctIndex: 2, hint: "Strength・Weakness・Opportunity・Threatの頭文字だよ。", explanation: "SWOT分析は内部要因（強み・弱み）と外部要因（機会・脅威）の4要素を組み合わせて戦略立案に役立てます。" },
        { question: "【ストラテジ】計画・実行・評価・改善の4段階を繰り返し、業務や品質を継続的に高める手法はどれですか？", choices: ["PDCAサイクル", "SECIモデル", "KJ法", "OJT"], correctIndex: 0, hint: "Plan・Do・Check・Actの4段階を回す手法だよ。", explanation: "PDCAサイクルは計画立案から実行、結果検証、改善アクションを循環させて継続的改善を図る枠組みです。" },
        { question: "【ストラテジ】最終ゴールであるKGIの達成度を測るために設定する、中間的な重要業績評価指標はどれですか？", choices: ["ROI", "KPI", "ROE", "TCO"], correctIndex: 1, hint: "Key Performance Indicatorの略称だよ。", explanation: "KPI（重要業績評価指標）は最終目標（KGI）に向けたプロセスの達成度を定量的に追跡するための指標です。" },
        { question: "【ストラテジ】最終目標であるKGIと、その達成度を計測する中間指標であるKPIの関係や評価指標を指す組み合わせはどれですか？", choices: ["KPI / KGI", "ROI / ROE", "BtoB / BtoC", "OJT / Off-JT"], correctIndex: 0, hint: "ゴール指標とプロセス指標の組み合わせだよ。", explanation: "KGI（重要目標達成指標）を達成するために、日々の行動や進捗を測るKPI（重要業績評価指標）を設定して管理します。" },
        { question: "【ストラテジ】会計・人事・生産・販売などの経営資源を一元管理し、経営効率を高める統合基幹業務システムはどれですか？", choices: ["CRM", "SFA", "ERP", "POSシステム"], correctIndex: 2, hint: "企業全体の経営資源を統合管理するシステムだよ。", explanation: "ERP（Enterprise Resource Planning）は部門ごとのデータを統合データベースで一元管理し、迅速な経営判断を支えます。" },
        { question: "【ストラテジ】顧客情報や購買・問い合わせ履歴などを一元管理・分析し、関係構築や満足度向上を図る手法はどれですか？", choices: ["SCM", "CRM", "ERP", "MRP"], correctIndex: 1, hint: "顧客関係管理の英語略称だよ。", explanation: "CRM（Customer Relationship Management）は顧客との長期的な信頼関係を築き、LTV（顧客生涯価値）を高める取り組みです。" },
        { question: "【ストラテジ】原材料の調達から製造、在庫管理、物流、販売までの供給連鎖全体を最適化する手法はどれですか？", choices: ["CRM", "SFA", "SCM", "EMS"], correctIndex: 2, hint: "サプライチェーン全体の最適化を指す略称だよ。", explanation: "SCM（Supply Chain Management）は企業間・部門間の情報共有によって在庫削減やリードタイム短縮を実現します。" },

        // ===== マネジメント系（176〜300問） =====

        { question: "【マネジメント】サービス提供者と利用者の間で、品質や稼働率などの合意内容を定めた文書はどれですか？", choices: ["RFP", "SLA", "ITIL", "PMBOK"], correctIndex: 1, hint: "Service Level Agreement（サービスレベル合意書）の略称だよ。", explanation: "SLAは応答時間や可用性、サポート受付時間などサービス品質の目標水準と、未達時の対応などを明確に合意する文書です。" },

        { question: "【マネジメント】縦軸に作業項目、横軸に日程をとり、予定と進捗を横棒グラフで表す管理表はどれですか？", choices: ["パレート図", "ガントチャート", "バーンダウンチャート", "アローダイアグラム"], correctIndex: 1, hint: "各タスクの開始日・終了日と進捗状況を横棒で視覚化する表だよ。", explanation: "ガントチャートはスケジュール全体の計画と実績の進み具合を一目で把握しやすく、進捗管理に広く使われます。" },
        { question: "【マネジメント】ITサービスの運用・管理におけるベストプラクティスを体系化したガイドラインはどれですか？", choices: ["PMBOK", "ITIL", "ISMS", "JIS Q 15001"], correctIndex: 1, hint: "Information Technology Infrastructure Libraryの略称だよ。", explanation: "ITILはインシデント管理や問題管理、変更管理などITサービスマネジメントの成功事例・枠組みを体系化したものです。" },

    // 用語集データ（quizListの正解用語を自動集約＋重要用語を網羅）
    const glossaryData = (() => {
        const seen = new Set();
        const items = [];
        const catMeta = {
            "【ストラテジ】": { cat: "ストラテジ", cls: "tag-st" },
            "【マネジメント】": { cat: "マネジメント", cls: "tag-mg" },
            "【テクノロジ】": { cat: "テクノロジ", cls: "tag-tc" }
        };
        quizList.forEach(q => {
            const term = q.choices[q.correctIndex];
            if (!term || seen.has(term)) return;
            seen.add(term);
            let meta = { cat: "共通", cls: "tag-st" };
            for (const prefix of Object.keys(catMeta)) {
                if (q.question.startsWith(prefix)) {
                    meta = catMeta[prefix];
                    break;
                }
            }
            items.push({
                cat: meta.cat,
                cls: meta.cls,
                term: term,
                desc: q.explanation
            });
        });
        return items;
    })();

    function formatTime(totalSec) {
        const safeSec = Math.max(0, totalSec);
        const mins = Math.floor(safeSec / 60);
        const secs = safeSec % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
        const lblTimer = document.getElementById("lbl-test-timer");
        const timerBar = document.getElementById("test-timer-bar");
        lblTimer.textContent = formatTime(remainingSeconds);

        }

    function renderGlossary(filterText = "") {
        const container = document.getElementById("glossary-list-container");
        container.innerHTML = "";
        const keyword = filterText.trim().toLowerCase();

        const filtered = glossaryData.filter(item =>
            !keyword ||
            item.term.toLowerCase().includes(keyword) ||
            item.desc.toLowerCase().includes(keyword) ||
            item.cat.toLowerCase().includes(keyword)
        );

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">該当する用語が見つかりませんでした。</p>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement("div");
            div.className = "glossary-item";
            div.innerHTML = `
                <div class="glossary-term">
                    <span class="glossary-tag ${item.cls}">${item.cat}</span>
                    ${item.term}
                </div>
                <p class="glossary-desc">${item.desc}</p>
            `;
            container.appendChild(div);
        });
    }

    function shuffleArray(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            let temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
        }
        return copy;
    }

    function showQuiz() {

        if (!currentQuiz._choicesShuffled) {

                isCorrect: idx === currentQuiz.correctIndex

            currentQuiz.choices = shuffled.map(item => item.text);
            currentQuiz.correctIndex = shuffled.findIndex(item => item.isCorrect);

function extractCategoryPrefix(questionText) {
        const match = questionText.match(/^【[^】]+】/);
        return match ? match[0] : "";
    }

    function shuffleChoices(choices, correctIndex) {
        const indexed = choices.map((text, idx) => ({
            text,
            isCorrect: idx === correctIndex
        }));

        for (let i = indexed.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
        }

        return {
            choices: indexed.map(item => item.text),
            correctIndex: indexed.findIndex(item => item.isCorrect)
        };
    }

    function buildReverseTestQuestion(targetQ, allQuestions) {
        const prefix = extractCategoryPrefix(targetQ.question);
        const term = targetQ.choices[targetQ.correctIndex];
        const sameCatPool = allQuestions.filter(
            q => q !== targetQ && extractCategoryPrefix(q.question) === prefix
        );
        const fallbackPool = allQuestions.filter(q => q !== targetQ);
        const candidates = sameCatPool.length >= 3 ? sameCatPool : fallbackPool;

        const distractors = shuffleArray(candidates)
            .slice(0, 3)
            .map(q => q.explanation);

        const shuffled = shuffleChoices([targetQ.explanation, ...distractors], 0);

        return {
            question: `${prefix}「${term}」の説明または役割として最も適切なものはどれですか？`,
            choices: shuffled.choices,
            correctIndex: shuffled.correctIndex,
            explanation: targetQ.explanation,
            qType: "逆引き"
        };
    }

    function buildScenarioTestQuestion(targetQ) {
        const prefix = extractCategoryPrefix(targetQ.question);
        const core = targetQ.question
            .replace(/^【[^】]+】/, "")
            .replace(/はどれですか？$/, "");
        const shuffled = shuffleChoices(targetQ.choices, targetQ.correctIndex);

        return {
            question: `${prefix}次の条件や状況に該当する用語・手法として最も適切なものを選んでください：${core}`,
            choices: shuffled.choices,
            correctIndex: shuffled.correctIndex,
            explanation: targetQ.explanation,
            qType: "条件・場面"
        };
    }

    function buildTestQuestion(rawQ, allQuestions) {
        const roll = Math.random();
        if (roll < 0.45) {
            return buildReverseTestQuestion(rawQ, allQuestions);
        }
        if (roll < 0.75) {
            return buildScenarioTestQuestion(rawQ);
        }
        const shuffled = shuffleChoices(rawQ.choices, rawQ.correctIndex);
        return {
            question: rawQ.question,
            choices: shuffled.choices,
            correctIndex: shuffled.correctIndex,
            explanation: rawQ.explanation,
            qType: "正引き"
        };
    }

    function startTestMode(questionCount, withTimer) {
        stopTimer();
        isFullTest = withTimer;
        testQuestions = shuffleArray(quizList)
            .slice(0, Math.min(questionCount, quizList.length))
            .map(q => buildTestQuestion(q, quizList));

        const container = document.getElementById("test-questions-container");
        container.innerHTML = "";

        document.getElementById("lbl-test-title").textContent = withTimer
            ? `本格テスト（全${testQuestions.length}問・制限時間120分）`

            : `⚠️ テスト中はヒントおよび用語集を使用できません。正引き・逆引き・条件/場面問題がランダム出題されます。`;

        const timerBar = document.getElementById("test-timer-bar");
        if (withTimer) {
            remainingSeconds = 120 * 60;
            timerBar.classList.remove("hidden");
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();

                    stopTimer();
                    alert("制限時間（120分）が終了しました。現在の回答で採点します。");
                    gradeTestMode(true);
                }
            }, 1000);
        } else {
            timerBar.classList.add("hidden");
        }

        document.getElementById("test-result-area").classList.add("hidden");
        document.getElementById("test-result-area").innerHTML = "";
        document.getElementById("btn-submit-test-top").classList.remove("hidden");
        document.getElementById("btn-test-back-top").classList.add("hidden");
        document.getElementById("btn-test-quit-top").classList.remove("hidden");
        document.getElementById("btn-submit-test").classList.remove("hidden");
        document.getElementById("btn-test-back").classList.add("hidden");

        testQuestions.forEach((q, qIdx) => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "test-item";
            itemDiv.id = `test-item-${qIdx}`;

            let choicesHtml = "";
            q.choices.forEach((choice, cIdx) => {
                choicesHtml += `
                    <label class="test-choice-label" id="test-label-${qIdx}-${cIdx}">
                        <input type="radio" name="test-q-${qIdx}" value="${cIdx}">
                        ${cIdx + 1}. ${choice}
                    </label>
                `;
            });

            itemDiv.innerHTML = `
                <div class="test-q-title">第 ${qIdx + 1} 問 [${q.qType}]</div>
                <div class="test-q-text">${q.question}</div>
                <div>${choicesHtml}</div>
                <div id="test-fb-${qIdx}" class="test-feedback hidden"></div>
                <div id="test-exp-${qIdx}" class="explanation-box hidden"></div>
            `;
            container.appendChild(itemDiv);
        });

        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-test").classList.remove("hidden");
        document.getElementById("screen-end").classList.add("hidden");
        window.scrollTo(0, 0);
    }

    function gradeTestMode(forceSubmit = false) {
        if (!forceSubmit) {
            let unanswered = [];
            for (let i = 0; i < testQuestions.length; i++) {
                const selected = document.querySelector(`input[name="test-q-${i}"]:checked`);
                if (!selected) {
                    unanswered.push(i + 1);
                }
            }

            if (unanswered.length > 0) {
                if (isFullTest) {
                    const proceed = confirm(`第 ${unanswered.join(", ")} 問が未回答です。このまま採点しますか？`);
                    if (!proceed) return;
                } else {
                    alert(`第 ${unanswered.join(", ")} 問が未回答です。すべての問題に回答してから採点してください。`);
                    return;
                }
            }
        }

        stopTimer();

        let score = 0;
        const total = testQuestions.length;
        testQuestions.forEach((q, qIdx) => {
            const selected = document.querySelector(`input[name="test-q-${qIdx}"]:checked`);
            const userAns = selected ? parseInt(selected.value, 10) : null;
            const fbDiv = document.getElementById(`test-fb-${qIdx}`);
            const expDiv = document.getElementById(`test-exp-${qIdx}`);
            const correctLabel = `${q.correctIndex + 1}. ${q.choices[q.correctIndex]}`;

            const radios = document.querySelectorAll(`input[name="test-q-${qIdx}"]`);
            radios.forEach(r => r.disabled = true);

            if (userAns === q.correctIndex) {
                score++;
                fbDiv.textContent = "⭕ 正解！";
                fbDiv.className = "test-feedback fb-correct";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.backgroundColor = "#d4edda";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.borderColor = "#28a745";
            } else {
                fbDiv.textContent = userAns !== null
                    ? `❌ 不正解（正解は ${correctLabel}）`
                    : `❌ 未回答（正解は ${correctLabel}）`;
                fbDiv.className = "test-feedback fb-wrong";
                if (userAns !== null) {
                    document.getElementById(`test-label-${qIdx}-${userAns}`).style.backgroundColor = "#f8d7da";
                    document.getElementById(`test-label-${qIdx}-${userAns}`).style.borderColor = "#dc3545";
                }
                document.getElementById(`test-label-${qIdx}-${q.correctIndex}`).style.backgroundColor = "#d4edda";
                document.getElementById(`test-label-${qIdx}-${q.correctIndex}`).style.borderColor = "#28a745";
            }

            expDiv.textContent = `📘 解説（正解：${correctLabel}）\n${q.explanation}`;
            expDiv.classList.remove("hidden");
        });

        const percentage = Math.round((score / total) * 100);
        const resultArea = document.getElementById("test-result-area");
        const passMsg = percentage >= 60
            ? "🎉 合格ライン（60%以上）達成！応用的な聞かれ方にも対応できています！"
            : "📚 あと少し！各問題の解説を見直して、用語の意味と区別を固めよう！";
        resultArea.innerHTML = `
            <h2 style="margin:0 0 10px 0; color:#333;">採点結果：${total}問中 ${score} 問正解（${percentage}点）</h2>
            <p style="margin:0; font-weight:bold; color:${percentage >= 60 ? '#28a745' : '#dc3545'};">${passMsg}</p>
        `;
        resultArea.classList.remove("hidden");

        document.getElementById("btn-submit-test-top").classList.add("hidden");
        document.getElementById("btn-test-back-top").classList.remove("hidden");
        document.getElementById("btn-test-quit-top").classList.add("hidden");
        document.getElementById("btn-submit-test").classList.add("hidden");
        document.getElementById("btn-test-back").classList.remove("hidden");

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openGlossary() {
        document.getElementById("input-glossary-search").value = "";
        renderGlossary();
        document.getElementById("modal-glossary").classList.remove("hidden");
    }

    function closeGlossary() {
        document.getElementById("modal-glossary").classList.add("hidden");
    }
    const STATS_STORAGE_KEY = "it_passport_quiz_stats_v2";

    function loadQuizStats() {
        try {
            return JSON.parse(localStorage.getItem(STATS_STORAGE_KEY)) || {};
        } catch (e) {
            return {};
        }
    }

    function saveQuizStats(stats) {
        localStorage.setItem(STATS_STORAGE_KEY, JSON.stringify(stats));
    }

    function recordQuestionResult(questionText, isCorrect) {
        if (!questionText) return;
        const stats = loadQuizStats();
        const prev = stats[questionText] || { attempts: 0, correct: 0, wrongStreak: 0 };
        prev.attempts += 1;
        if (isCorrect) {
            prev.correct += 1;
            prev.wrongStreak = 0;
        } else {
            prev.wrongStreak += 1;
        }
        stats[questionText] = prev;
        saveQuizStats(stats);
    }

    function resetQuizStats() {
        if (confirm("これまでの問題ごとの正解率・挑戦記録をすべて削除しますか？")) {
            localStorage.removeItem(STATS_STORAGE_KEY);
            alert("成績データをリセットしました。");
            if (!document.getElementById("screen-review").classList.contains("hidden")) {
                renderReviewList();
            }
        }
    }

    function getWeaknessSortedQuestions() {
        const stats = loadQuizStats();
        return quizList
            .map(q => {
                const r = stats[q.question];
                if (!r || r.attempts === 0) {
                    return { q, priority: 50 };
                }
                const rate = r.correct / r.attempts;
                const priority = (1 - rate) * 100 + (r.wrongStreak || 0) * 15;
                return { q, priority };
            })
            .sort((a, b) => b.priority - a.priority || Math.random() - 0.5)
            .map(item => item.q);
    }

    function openReviewScreen() {
        stopTimer();
        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-test").classList.add("hidden");
        document.getElementById("screen-end").classList.add("hidden");
        document.getElementById("screen-review").classList.remove("hidden");
        renderReviewList();
        window.scrollTo(0, 0);
    }

    function renderReviewList() {
        const keyword = (document.getElementById("input-review-search")?.value || "").trim().toLowerCase();
        const filterType = document.getElementById("select-review-filter")?.value || "all";
        const stats = loadQuizStats();
        const container = document.getElementById("review-list-container");
        container.innerHTML = "";

        const list = quizList.filter(q => {
            const r = stats[q.question];
            const answer = q.choices[q.correctIndex];
            const matchesKeyword = !keyword ||
                q.question.toLowerCase().includes(keyword) ||
                answer.toLowerCase().includes(keyword) ||
                q.explanation.toLowerCase().includes(keyword);
            if (!matchesKeyword) return false;

            if (filterType === "unanswered") {
                return !r || r.attempts === 0;
            }
            if (filterType === "weak") {
                if (!r || r.attempts === 0) return false;
                return (r.correct / r.attempts) < 0.6 || (r.wrongStreak || 0) > 0;
            }
            return true;
        });

        list.forEach((q, idx) => {
            const r = stats[q.question];
            const statLabel = (!r || r.attempts === 0)
                ? "未回答"
                : `${r.correct}/${r.attempts}回正解（${Math.round((r.correct / r.attempts) * 100)}%）`;
            const card = document.createElement("div");
            card.className = "test-item";
            card.innerHTML = `
                <div class="test-q-title">Q${idx + 1} ｜ ${statLabel}</div>
                <div class="test-q-text">${q.question}</div>
                <div style="font-weight:bold; color:#155724; margin-bottom:6px;">正解：${q.choices[q.correctIndex]}</div>
                <div class="explanation-box" style="margin:0;">${q.explanation}</div>
            `;
            container.appendChild(card);
        });
    }

    // 既存関数に成績保存・弱点克服モード・画面切り替えを後付け連携
    const _origShowStartScreen = showStartScreen;
    showStartScreen = function() {
        document.getElementById("screen-review").classList.add("hidden");
        _origShowStartScreen();
    };

    const _origStartQuiz = startQuiz;
    startQuiz = function(mode) {
        if (mode === "weakness") {
            stopTimer();
            currentMode = "weakness";
            currentQuizIndex = 0;
            correctCount = 0;
            playList = getWeaknessSortedQuestions().slice(0, 10);
            document.getElementById("lbl-mode-badge").textContent = "🎯 弱点克服モード";
            document.getElementById("screen-start").classList.add("hidden");
            document.getElementById("screen-quiz").classList.remove("hidden");
            document.getElementById("screen-test").classList.add("hidden");
            document.getElementById("screen-end").classList.add("hidden");
            document.getElementById("screen-review").classList.add("hidden");
            showQuiz();
            return;
        }
        document.getElementById("screen-review").classList.add("hidden");
        _origStartQuiz(mode);
    };

    const _origSelectChoice = selectChoice;
    selectChoice = function(selectedIndex) {
        const targetQ = playList[currentQuizIndex];
        if (targetQ) {
            recordQuestionResult(targetQ.question, selectedIndex === targetQ.correctIndex);
        }
        _origSelectChoice(selectedIndex);
    };

    const _origGradeTestMode = gradeTestMode;
    gradeTestMode = function(forceSubmit = false) {
        const beforeDisabled = document.querySelector(`input[name="test-q-0"]`)?.disabled;
        _origGradeTestMode(forceSubmit);
        const afterDisabled = document.querySelector(`input[name="test-q-0"]`)?.disabled;
        if (!beforeDisabled && afterDisabled && Array.isArray(testQuestions)) {
            testQuestions.forEach((q, qIdx) => {
                const selected = document.querySelector(`input[name="test-q-${qIdx}"]:checked`);
                const userAns = selected ? parseInt(selected.value, 10) : null;
                recordQuestionResult(q.question, userAns === q.correctIndex);
            });
        }
    };
</script>
