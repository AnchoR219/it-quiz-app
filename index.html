```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITパスポート クイズDX（全問解説・全500問・大容量用語集）</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .progress {
            font-size: 14px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-mode {
            background-color: #e9ecef;
            color: #495057;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .question-text {
            font-size: 16px;
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .choices-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-choice {
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #007bff;
            background-color: #ffffff;
            color: #007bff;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-choice:hover:not(:disabled) {
            background-color: #007bff;
            color: #ffffff;
        }

        .btn-choice:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-hint {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn-hint:hover {
            background-color: #e0a800;
        }

        .hint-box {
            background-color: #fff9db;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            font-size: 14px;
            color: #856404;
            margin-bottom: 15px;
            border-radius: 4px;
            line-height: 1.5;
        }

        .result-message {
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            min-height: 27px;
            line-height: 1.4;
        }

        .explanation-box {
            background-color: #eef6ff;
            border-left: 4px solid #007bff;
            padding: 14px 16px;
            font-size: 14px;
            color: #1f2d3d;
            margin-top: 6px;
            margin-bottom: 14px;
            border-radius: 6px;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background-color: #28a745;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 10px;
        }
        .btn-action:hover:not(:disabled) {
            background-color: #218838;
        }
        .btn-action:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .btn-strategy { background-color: #17a2b8; }
        .btn-strategy:hover { background-color: #138496; }

        .btn-management { background-color: #fd7e14; }
        .btn-management:hover { background-color: #e86b05; }

        .btn-technology { background-color: #6f42c1; }
        .btn-technology:hover { background-color: #5a32a3; }

        .btn-endless {
            background-color: #20c997;
        }
        .btn-endless:hover {
            background-color: #1ba87e;
        }

        .btn-test {
            background-color: #dc3545;
        }
        .btn-test:hover {
            background-color: #c82333;
        }

        .btn-full-test {
            background-color: #343a40;
        }
        .btn-full-test:hover {
            background-color: #23272b;
        }

        .btn-glossary-open {
            background-color: #6c757d;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn-glossary-open:hover {
            background-color: #5a6268;
        }

        .btn-quit {
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            display: block;
            margin: 10px auto 0;
        }

        /* 模擬テスト・本格テストモード専用スタイル */
        .test-top-controls {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 18px;
        }

        .test-top-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .test-top-buttons .btn-action {
            margin-bottom: 0;
            flex: 1;
        }

        .btn-top-return {
            background-color: #ffffff;
            color: #495057;
            border: 2px solid #ced4da;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-top-return:hover {
            background-color: #e9ecef;
            color: #212529;
        }

        .test-bottom-controls {
            margin-top: 20px;
            padding-top: 10px;
        }

        .test-header-notice {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 14px;
            text-align: center;
        }

        .timer-bar {
            position: sticky;
            top: 10px;
            background-color: #212529;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .timer-warning {
            background-color: #dc3545;
        }

        .test-item {
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .test-q-title {
            font-weight: bold;
            color: #007bff;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .test-q-text {
            font-size: 15px;
            color: #2c3e50;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .test-choice-label {
            display: block;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .test-choice-label:hover {
            background-color: #f1f3f5;
        }
        .test-choice-label input {
            margin-right: 8px;
        }

        .test-result-box {
            background-color: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .test-feedback {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .fb-correct {
            background-color: #d4edda;
            color: #155724;
        }
        .fb-wrong {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* 用語集モーダル */
        .glossary-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .glossary-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .glossary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .glossary-header h2 {
            margin: 0;
            font-size: 20px;
            color: #333;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .glossary-search {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        .glossary-search:focus {
            border-color: #007bff;
        }

        .glossary-list {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .glossary-item {
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f1f1;
        }

        .glossary-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            color: #fff;
        }
        .tag-st { background-color: #17a2b8; }
        .tag-mg { background-color: #fd7e14; }
        .tag-tc { background-color: #6f42c1; }

        .glossary-term {
            font-weight: bold;
            color: #007bff;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }

        .glossary-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin: 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- タイトル画面 -->
    <div id="screen-start">
        <h1>ITパスポート クイズDX</h1>
        <p class="subtitle">
            全500問＆大容量用語集（全80語）搭載！学習スタイルや分野別に選んで学べます。
        </p>
        <button class="btn-action" onclick="startQuiz('normal')">
            📝 10問ランダムチャレンジ
        </button>
        <button class="btn-action btn-strategy" onclick="startQuiz('strategy')">
            🏢 ストラテジ系 分野別チャレンジ
        </button>
        <button class="btn-action btn-management" onclick="startQuiz('management')">
            📊 マネジメント系 分野別チャレンジ
        </button>
        <button class="btn-action btn-technology" onclick="startQuiz('technology')">
            💻 テクノロジ系 分野別チャレンジ
        </button>
        <button class="btn-action btn-endless" onclick="startQuiz('endless')">
            🔥 エンドレスモード（失敗しても無限に解ける）
        </button>
        <button class="btn-action btn-test" onclick="startTestMode(10, false)">
            ⏱️ 模擬テストモード（10問一括・ヒント/用語集/解説なし）
        </button>
        <button class="btn-action btn-full-test" onclick="startTestMode(100, true)">
            🏆 本格テストモード（全100問・制限時間120分）
        </button>
        <hr style="border: none; border-top: 1px solid #eee; margin: 15px 0;">
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を見る（全80語・検索対応）</button>
    </div>

    <!-- 通常＆エンドレス＆分野別 クイズ画面 -->
    <div id="screen-quiz" class="hidden">
        <div class="progress">
            <span id="lbl-progress">第 1 問 / 全 10 問</span>
            <span id="lbl-mode-badge" class="badge-mode">モード</span>
        </div>
        <div id="lbl-question" class="question-text"></div>
        
        <button class="btn-hint" onclick="showHint()">💡 ヒントを見る</button>
        <div id="lbl-hint" class="hint-box hidden"></div>

        <div class="choices-grid">
            <button class="btn-choice" onclick="selectChoice(0)"></button>
            <button class="btn-choice" onclick="selectChoice(1)"></button>
            <button class="btn-choice" onclick="selectChoice(2)"></button>
            <button class="btn-choice" onclick="selectChoice(3)"></button>
        </div>

        <div id="lbl-result" class="result-message"></div>
        <button id="btn-next" class="btn-action" onclick="nextQuestion()" disabled>次の問題へ</button>
        <div id="lbl-explanation" class="explanation-box hidden"></div>
        
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を開いて確認する</button>
        <button class="btn-quit" onclick="showStartScreen()">タイトルに戻る</button>
    </div>

    <!-- 模擬テスト・本格テストモード画面 -->
    <div id="screen-test" class="hidden">
        <h1 id="lbl-test-title">模擬テスト（全10問）</h1>
        <div id="test-timer-bar" class="timer-bar hidden">
            <span>⏳ 残り時間</span>
            <span id="lbl-test-timer">120:00</span>
        </div>
        <div class="test-top-controls">
            <div class="test-top-buttons">
                <button id="btn-submit-test-top" class="btn-action btn-test" onclick="gradeTestMode(false)">回答を提出して採点する</button>
                <button id="btn-test-back-top" class="btn-action hidden" onclick="showStartScreen()">タイトルに戻る</button>
                <button id="btn-test-quit-top" class="btn-top-return" onclick="showStartScreen()">タイトルに戻る</button>
            </div>
        </div>
        <div id="lbl-test-notice" class="test-header-notice">
            ⚠️ テスト中はヒントおよび用語集を使用できません。全10問に回答して採点してください。
        </div>
        <div id="test-result-area" class="test-result-box hidden"></div>
        <div id="test-questions-container"></div>
        <div class="test-bottom-controls">
            <button id="btn-submit-test" class="btn-action btn-test" onclick="gradeTestMode(false)">回答を提出して採点する</button>
            <button id="btn-test-back" class="btn-action hidden" onclick="showStartScreen()">タイトルに戻る</button>
        </div>
    </div>

    <!-- 終了画面 -->
    <div id="screen-end" class="hidden">
        <h1 id="lbl-end-title">クイズ終了！</h1>
        <p id="lbl-final-score" class="question-text" style="text-align: center; font-size: 18px;"></p>
        <button class="btn-action" onclick="showStartScreen()">タイトルに戻る</button>
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を復習する</button>
    </div>
</div>

<!-- 用語集モーダルウィンドウ -->
<div id="modal-glossary" class="glossary-modal hidden">
    <div class="glossary-content">
        <div class="glossary-header">
            <h2>ITパスポート頻出 用語集（全80語）</h2>
            <button class="btn-close" onclick="closeGlossary()">×</button>
        </div>
        <input type="text" id="input-glossary-search" class="glossary-search" placeholder="🔍 キーワードで検索（例：セキュリティ、クラウド、AI...）" onkeyup="filterGlossary()">
        <div id="glossary-list-container" class="glossary-list"></div>
        <button class="btn-action" style="margin-top: 15px; margin-bottom: 0;" onclick="closeGlossary()">閉じる</button>
    </div>
</div>

<script>
    const glossaryData = [
        { cat: "ストラテジ", cls: "tag-st", term: "DX（デジタルトランスフォーメーション）", desc: "デジタル技術を活用して、ビジネスモデルや業務プロセス、組織文化などを根本から変革し、競争上の優位性を確立すること。" },
        { cat: "ストラテジ", cls: "tag-st", term: "BCP（事業継続計画）", desc: "自然災害やシステム障害などの緊急事態が発生した際、損害を最小限に抑えつつ中核事業を継続・早期復旧させるための事前計画。" },
        { cat: "ストラテジ", cls: "tag-st", term: "SWOT分析", desc: "自社の「強み(S)・弱み(W)」と外部環境の「機会(O)・脅威(T)」の4つの軸で現状を整理し、経営戦略を立てる分析手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "PDCAサイクル", desc: "Plan（計画）→ Do（実行）→ Check（評価）→ Act（改善）の4段階を繰り返し、業務を継続的に改善する手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "KPI / KGI", desc: "KGIは「重要目標達成指標（最終ゴール）」、KPIはそこに至るまでの過程を計測する「重要業績評価指標（中間目標）」のこと。" },
        { cat: "ストラテジ", cls: "tag-st", term: "ERP（企業資源計画）", desc: "会計・人事・生産・販売などの企業全体の経営資源（ヒト・モノ・カネ・情報）を一元管理し、経営効率を高める統合基幹業務システム。" },
        { cat: "ストラテジ", cls: "tag-st", term: "CRM（顧客関係管理）", desc: "顧客の属性や購買履歴などを管理・分析し、一人ひとりに最適な対応を行うことで顧客満足度やリピート率を高める手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "SCM（サプライチェーンマネジメント）", desc: "原材料の調達から製造、在庫管理、配送、販売までのモノの流れ全体を最適化し、コスト削減や納期短縮を図る経営手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "OEM", desc: "相手先ブランドによる生産のこと。他社ブランドの製品を製造すること、または自社で工場を持たず他社に製造を委託する形態。" },
        { cat: "ストラテジ", cls: "tag-st", term: "アウトソーシング", desc: "自社の業務やシステム運用などの一部を、外部の専門企業に委託すること。" },
        { cat: "ストラテジ", cls: "tag-st", term: "コーポレートガバナンス", desc: "企業経営の透明性や公正性を確保するために、株主や社外取締役などが経営陣を監視・統制する仕組み（企業統治）。" },
        { cat: "ストラテジ", cls: "tag-st", term: "内部統制", desc: "企業が法令を遵守し、業務の有効性・効率性を高め、不正やミスを防ぐために社内で構築・運用する管理・チェック体制。" },
        { cat: "ストラテジ", cls: "tag-st", term: "コンプライアンス", desc: "企業が法律や規則を守るだけでなく、社会的な倫理や道徳、社内ルールまで含めて遵守すること（法令遵守）。" },
        { cat: "ストラテジ", cls: "tag-st", term: "NDA（秘密保持契約）", desc: "ビジネスの取引や業務委託の際に、知り得た機密情報を第三者に漏らさないことを約束する契約。" },
        { cat: "ストラテジ", cls: "tag-st", term: "著作権", desc: "小説、イラスト、音楽、プログラムなどの著作物を創作した人が持つ権利。無断での複製・改変・公開を禁止します。" },
        { cat: "ストラテジ", cls: "tag-st", term: "特許権 / 商標権 / 意匠権", desc: "特許権は「高度な発明」、商標権は「商品名やロゴマーク」、意匠権は「製品のデザイン・外観」を保護する知的財産権。" },
        { cat: "ストラテジ", cls: "tag-st", term: "個人情報保護法", desc: "氏名・住所・マイナンバーなど個人を特定できる情報の適正な取り扱いを企業などに義務づけた日本の法律。" },
        { cat: "ストラテジ", cls: "tag-st", term: "不正アクセス禁止法", desc: "他人のID・パスワードを無断で使ったり、セキュリティの穴を突いてコンピュータに侵入したりする行為を罰する法律。" },
        { cat: "ストラテジ", cls: "tag-st", term: "プライバシーマーク（Pマーク）", desc: "個人情報の保護体制が適切に整備されていると評価された事業者に付与される認証マーク。" },

        { question: "【ストラテジ】企業が保持する個人情報の取り扱いについて定めた日本の法律はどれですか？", choices: ["不正アクセス禁止法", "個人情報保護法", "特定商取引法", "電子署名法"], correctIndex: 1, hint: "名前のとおり、個人のプライバシー情報を守るための法律だよ。", explanation: "個人情報保護法は、個人情報の適正な取得・利用・安全管理などを事業者に義務づける法律です。" },
        { question: "【ストラテジ】企業などの組織において、業務プロセスの不正や誤りを防ぐために内部で設定される仕組みや手続のことを何と呼びますか？", choices: ["内部統制", "コーポレートガバナンス", "コンプライアンス", "BCP"], correctIndex: 0, hint: "社内でルールをしっかり管理・チェックする仕組みのことだよ。", explanation: "内部統制は業務の適正化や不正・ミス防止のために社内で整備・運用する仕組みです。コーポレートガバナンスは経営陣を監視・統制する企業統治を指します。" },

        { question: "【ストラテジ】大規模災害などの緊急事態が発生した際に、損害を最小限に抑えつつ事業を継続・早期復旧させるための計画はどれですか？", choices: ["BCP（事業継続計画）", "SLA（サービスレベル合意）", "RFP（提案依頼書）", "NDA（秘密保持契約）"], correctIndex: 0, hint: "Business Continuity Plan（ビジネスの継続）の略称だよ。", explanation: "BCPは災害や障害などの緊急時に重要業務を継続・早期復旧するための計画です。SLAはサービス品質の合意、RFPは提案依頼書、NDAは秘密保持契約です。" },
        { question: "【ストラテジ】自社の強み（Strengths）、弱み（Weaknesses）、機会（Opportunities）、脅威（Threats）を分析する手法はどれですか？", choices: ["SWOT分析", "3C分析", "PEST分析", "PPM分析"], correctIndex: 0, hint: "それぞれの頭文字をとった4文字の英単語だよ。", explanation: "SWOT分析は内部環境の「強み・弱み」と外部環境の「機会・脅威」の4要素で戦略を整理するフレームワークです。" },
        { question: "【ストラテジ】新規事業の契約締結時などに、業務上知り得た他社の秘密情報を第三者に漏洩しないことを約束する契約はどれですか？", choices: ["NDA（秘密保持契約）", "SLA（サービスレベル合意）", "RFP（提案依頼書）", "基本売買契約"], correctIndex: 0, hint: "Non-Disclosure Agreement（秘密保持）の略だよ。", explanation: "NDAは取引や協業の際に知った秘密情報を第三者へ漏らさないことを取り決める秘密保持契約です。" },
        { question: "【ストラテジ】ソフトウェアの違法コピーや無断複製を禁止する法律として、著作権法のほかに当てはまるものはどれですか？", choices: ["不正競争防止法", "労働者派遣法", "特定商取引法", "電気通信事業法"], correctIndex: 0, hint: "ビジネス上の不正な競争や営業秘密の侵害を防ぐ法律だよ。", explanation: "不正競争防止法は営業秘密の侵害や不正な競争行為を防ぐ法律で、技術的制限手段を回避する行為なども規制対象になります。" },
        { question: "【ストラテジ】自社のコア事業に集中するため、業務プロセスの一部を外部の専門業者に委託することを何と呼びますか？", choices: ["アウトソーシング", "インソーシング", "フランチャイズ", "クラウドファンディング"], correctIndex: 0, hint: "社外（アウト）の専門家に業務を任せることだよ。", explanation: "アウトソーシングは業務の一部を外部の専門企業に委託することです。社内で行うことはインソーシングと呼びます。" },
        { question: "【マネジメント】システム開発の手法のうち、小さな単位で設計・実装・テストを短期間で繰り返しながら開発を進めていく手法はどれですか？", choices: ["ウォーターフォールモデル", "アジャイル開発", "プロトタイピング", "バッチ処理"], correctIndex: 1, hint: "「素早い、機敏な」という意味を持つ英語が名前の由来だよ。", explanation: "アジャイル開発は短いサイクル（イテレーション・スプリント）で開発とテストを繰り返し、仕様変更に柔軟に対応する手法です。" },
        { question: "【マネジメント】上流工程から下流工程へと滝のように順番に進める開発モデルはどれですか？", choices: ["ウォーターフォールモデル", "アジャイル開発", "エクストリームプログラミング", "スパイラルモデル"], correctIndex: 0, hint: "水が上から下に流れる「滝」をイメージしてね。", explanation: "ウォーターフォールモデルは要件定義→設計→実装→テストを段階的に順番に進める伝統的な開発モデルです。" },
        { question: "【マネジメント】システムの発注者が、受注候補のITベンダーに対して「具体的な提案を出してください」と依頼する文書はどれですか？", choices: ["RFP（提案依頼書）", "RFI（情報提供依頼書）", "SLA（サービスレベル合意書）", "仕様書"], correctIndex: 0, hint: "Request for Proposal（プロポーザル＝提案）の略だよ。", explanation: "RFPは発注企業がベンダーに提案書や見積もりを求める文書です。RFIは提案前の情報収集を目的とした情報提供依頼書です。" },
        { question: "【マネジメント】ITサービスの提供者と利用者の間で、提供するサービスの品質（稼働率など）に関して合意する契約はどれですか？", choices: ["SLA（Service Level Agreement）", "NDA", "RFP", "ISMS"], correctIndex: 0, hint: "サービスの「レベル」について約束する文書だよ。", explanation: "SLAは稼働率や応答時間などのサービス品質基準や対応範囲をサービス提供者と利用者間で合意したものです。" },
        { question: "【マネジメント】プロジェクト管理において、全体の工程遅延に直結する「最も期間が長くなる作業経路」のことを何と呼びますか？", choices: ["クリティカルパス", "マイルストーン", "ガントチャート", "WBS"], correctIndex: 0, hint: "「重大な・きわどい（クリティカル）」な道のり（パス）のことだよ。", explanation: "クリティカルパスは開始から終了までで所要時間が最も長い経路で、この経路上の作業が遅れると全体の納期も遅れます。" },

        { question: "【マネジメント】プロジェクトの作業内容を細かく分解し、木構造（階層構造）で整理した構成図のことを何と呼びますか？", choices: ["WBS（Work Breakdown Structure）", "アローダイアグラム", "フローチャート", "ER図"], correctIndex: 0, hint: "仕事を「ブレイクダウン（分解）」していく仕組みだよ。", explanation: "WBSはプロジェクトの作業を末端の実行可能な単位まで階層分解した構成図です。" },
        { question: "【マネジメント】業務の品質改善などを継続的に進めるための手法「PDCAサイクル」の「C」が表す意味はどれですか？", choices: ["Check（評価・検証）", "Control（管理）", "Change（変更）", "Create（創造）"], correctIndex: 0, hint: "計画（Plan）して実行（Do）したあと、「確認・評価」するステップだよ。", explanation: "PDCAは Plan（計画）→ Do（実行）→ Check（評価・検証）→ Act（改善・処置）の頭文字です。" },
        { question: "【マネジメント】システム開発で、本番と同じ環境でシステム全体が要件通りに動くかを検証するテストはどれですか？", choices: ["総合テスト（システムテスト）", "単体テスト", "結合テスト", "レビュー"], correctIndex: 0, hint: "バラバラの部品ではなく、全体を「総合」して確かめるテストだよ。", explanation: "総合テストはシステム全体を本番に近い環境で検証します。単体テストはモジュール単位、結合テストはモジュール間の連携を確認します。" },
        { question: "【マネジメント】システムで発生した障害や問合せを一元的に受け付ける単一の窓口のことを何と呼びますか？", choices: ["サービスデスク", "データセンター", "コンサルティングデスク", "開発部門"], correctIndex: 0, hint: "ITILで使われる、利用者の問い合わせを一手に引き受ける窓口だよ。", explanation: "サービスデスクは利用者からの問い合わせやインシデント報告を一元受付し、一次対応や案内を行う窓口です。" },
        { question: "【マネジメント】ITサービスマネジメントのベストプラクティス（成功事例集）を体系的にまとめたフレームワークはどれですか？", choices: ["ITIL（アイティル）", "COBIT", "ISO27001", "PMBOK"], correctIndex: 0, hint: "Information Technology Infrastructure Library の略称だよ。", explanation: "ITILはITサービスの運用・管理におけるベストプラクティスを体系化したガイドラインです。" },
        { question: "【テクノロジ】パスワードの適切な管理方法に関する記述として、最も適切なものはどれですか？", choices: ["忘れないようにディスプレイの横に貼っておく", "使い回しを避け、推測されにくい文字列を設定する", "複数のWebサイトで全て同じパスワードを使用する", "定期的に生年月日を組み合わせた単純なものに変更する"], correctIndex: 1, hint: "他人に推測されにくく、サービスごとに違うものを使うのが鉄則だよ。", explanation: "パスワードはサービスごとに異なるものを設定し、推測されにくい複雑な文字列にするのが基本です。" },
        { question: "【テクノロジ】画面上に「ウイルスに感染しました」と偽の警告を出して不安にさせ、不正なソフトを購入させようとする攻撃手法はどれですか？", choices: ["フィッシング", "フェイクアラート（偽警告）", "ランサムウェア", "ブルートフォース攻撃"], correctIndex: 1, hint: "「フェイク（嘘の）」な「アラート（警告）」を表示する手口だよ。", explanation: "フェイクアラートは偽の警告画面やポップアップを表示して不安をあおり、偽セキュリティソフト購入やサポート詐欺へ誘導する手口です。" },
        { question: "【テクノロジ】データを暗号化して読み取れない状態にし、元に戻すための「身代金」を要求する悪質なプログラムはどれですか？", choices: ["ランサムウェア", "スパイウェア", "トロイの木馬", "アドウェア"], correctIndex: 0, hint: "英語で身代金を意味する「ランサム（Ransom）」が名前に入っているよ。", explanation: "ランサムウェアはファイルを暗号化して利用不能にし、復号と引き換えに身代金を要求するマルウェアです。" },
        { question: "【テクノロジ】Webサイトの通信を暗号化し、アドレスが「https://」で始まる仕組みに使われているプロトコルはどれですか？", choices: ["FTP", "DHCP", "SSL/TLS", "SMTP"], correctIndex: 2, hint: "通信を安全にするための暗号化技術だよ。", explanation: "SSL/TLSは通信を暗号化して盗聴や改ざんを防ぐ仕組みで、HTTPS通信で利用されます。" },
        { question: "【テクノロジ】インターネット上のコンピュータやルータを識別するために割り振られる、ネット上の住所にあたる番号はどれですか？", choices: ["MACアドレス", "IPアドレス", "URL", "ポート番号"], correctIndex: 1, hint: "ネットワーク上の機器に割り振られる識別番号だよ。", explanation: "IPアドレスはネットワーク上の機器を識別する番号です。MACアドレスはネットワーク機器（NIC）固有の物理アドレスです。" },

        { question: "【テクノロジ】「example.com」のようなドメイン名と、IPアドレスを相互に変換する仕組みはどれですか？", choices: ["DNS", "DHCP", "HTTP", "NTP"], correctIndex: 0, hint: "Domain Name System の略だよ。", explanation: "DNSは人が覚えやすいドメイン名と、通信に使われるIPアドレスを対応づけて変換する仕組みです。" },
        { question: "【テクノロジ】コンピュータの五大装置のうち、計算やデータの処理を担う中心的な装置はどれですか？", choices: ["記憶装置", "制御装置", "演算装置（CPU）", "入力装置"], correctIndex: 2, hint: "人間の「頭脳」にあたるパーツだよ。", explanation: "CPUは制御装置と演算装置を備え、命令の解釈・実行や計算処理を行うコンピュータの中枢です。" },
        { question: "【テクノロジ】電源を切ると記憶内容が消えてしまう（揮発性を持つ）が、読み書きが高速な主記憶装置に使われるメモリはどれですか？", choices: ["RAM", "ROM", "SSD", "フラッシュメモリ"], correctIndex: 0, hint: "作業机の役割をする、電源を落とすと消えるメモリだよ。", explanation: "RAMは読み書きが可能な主記憶用メモリで、電源を切ると内容が消えます。ROMは読み出し専用で電源を切っても残ります。" },
        { question: "【テクノロジ】データベースで、データを「行」と「列」の2次元の表形式で管理する最も一般的なデータベース構造はどれですか？", choices: ["リレーショナルデータベース（RDB）", "階層型データベース", "ネットワーク型データベース", "NoSQL"], correctIndex: 0, hint: "表と表を関連付け（リレーション）して管理する仕組みだよ。", explanation: "RDBは行（レコード）と列（フィールド）からなる表形式でデータを管理し、表同士を関連付けて扱います。" },
        { question: "【テクノロジ】リレーショナルデータベースで、各行を一意に識別するために重複や空欄を許さない項目のことを何と呼びますか？", choices: ["主キー（プライマリキー）", "外部キー", "インデックス", "フィールド"], correctIndex: 0, hint: "データを特定するための「メインの鍵」となる項目だよ。", explanation: "主キーは表の各行を一意に識別するための列で、重複やNULL（空）は許されません。" },
        { question: "【ストラテジ】デジタル技術を活用してビジネスモデルや業務プロセスを根本から変革し、競争優位性を確立することを何と呼びますか？", choices: ["DX（デジタルトランスフォーメーション）", "BPR", "アウトソーシング", "テレワーク"], correctIndex: 0, hint: "Digital Transformation の略称だよ。", explanation: "DXはデジタル技術の活用によって顧客体験やビジネスモデル、業務・組織を変革し競争優位を築くことです。" },
        { question: "【ストラテジ】企業の会計・人事・生産・販売などの経営資源を一元管理し、経営効率を高める統合基幹業務システムはどれですか？", choices: ["ERP", "CRM", "POS", "CAD"], correctIndex: 0, hint: "Enterprise Resource Planning（企業資源計画）の略だよ。", explanation: "ERPは部門ごとの業務データを統合管理して経営全体の効率化や意思決定を支援するシステムです。" },
        { question: "【ストラテジ】顧客の属性や購買履歴などを管理・分析し、一人ひとりに最適な対応を行うことで顧客満足度を高める手法はどれですか？", choices: ["CRM（顧客関係管理）", "SCM", "ERP", "SFA"], correctIndex: 0, hint: "Customer Relationship Management の略だよ。", explanation: "CRMは顧客情報や接点履歴を一元管理・分析し、長期的な関係構築や顧客満足度向上を図る手法です。" },
        { question: "【ストラテジ】原材料の調達から製造、在庫管理、配送、販売までのモノの流れ全体を最適化する経営手法はどれですか？", choices: ["SCM（サプライチェーンマネジメント）", "CRM", "KM", "BCP"], correctIndex: 0, hint: "Supply Chain（供給の連鎖）を管理する手法だよ。", explanation: "SCMは供給連鎖に関わる企業・工程間で情報を共有し、在庫削減やリードタイム短縮などを全体最適化する手法です。" },
        { question: "【ストラテジ】最終ゴールであるKGIに対し、そこに至るまでの達成度を計測する「重要業績評価指標（中間目標）」を何と呼びますか？", choices: ["KPI", "ROI", "ROE", "TCO"], correctIndex: 0, hint: "Key Performance Indicator の略称だよ。", explanation: "KGIが最終目標、KPIはその達成度を測る中間指標（重要業績評価指標）です。" },

        { question: "【ストラテジ】製品のデザインや外観の美しさを保護する知的財産権はどれですか？", choices: ["意匠権", "特許権", "実用新案権", "商標権"], correctIndex: 0, hint: "見た目やデザイン（意匠）を守る権利だよ。", explanation: "意匠権は物品などのデザイン（形状・模様・色彩など）を保護する知的財産権です。" },
        { question: "【ストラテジ】商品やサービスのネーミング、ロゴマークなどを保護する知的財産権はどれですか？", choices: ["商標権", "著作権", "特許権", "意匠権"], correctIndex: 0, hint: "ブランド名やマーク（商標）を守る権利だよ。", explanation: "商標権は自社の商品やサービスを他社と識別するための名称やロゴマークなどを保護する権利です。" },
        { question: "【ストラテジ】個人情報の保護体制が適切に整備されている事業者に付与される認証マークはどれですか？", choices: ["プライバシーマーク（Pマーク）", "ISMSマーク", "JISマーク", "エコマーク"], correctIndex: 0, hint: "プライバシーを守る企業に与えられる「P」のマークだよ。", explanation: "プライバシーマークは個人情報の適切な取り扱い体制を整備している事業者に付与される認証制度のマークです。" },
        { question: "【ストラテジ】金融（Finance）とIT技術（Technology）を融合させた、スマホ決済や仮想通貨などの新しい金融サービスはどれですか？", choices: ["フィンテック（FinTech）", "エドテック", "アグリテック", "ヘルステック"], correctIndex: 0, hint: "Finance と Technology を組み合わせた造語だよ。", explanation: "フィンテックは金融とITを融合したサービスや仕組みの総称で、キャッシュレス決済や家計管理、資産運用などに広がっています。" },
        { question: "【ストラテジ】製品を買い切るのではなく、利用期間に応じて定額料金を支払うビジネスモデルはどれですか？", choices: ["サブスクリプション", "フリーミアム", "アフィリエイト", "クラウドファンディング"], correctIndex: 0, hint: "動画配信や音楽配信などで一般的な「定額制サービス」のことだよ。", explanation: "サブスクリプションは一定期間の利用に対して定額料金を支払うビジネスモデルです。フリーミアムは基本無料で高度機能を課金するモデルです。" },
        { question: "【ストラテジ】経営陣の不正を防ぎ、企業経営の透明性や公正性を確保するために監視・統制する仕組み（企業統治）を何と呼びますか？", choices: ["コーポレートガバナンス", "コンプライアンス", "ディスクロージャー", "CSR"], correctIndex: 0, hint: "企業（コーポレート）を統治・監視（ガバナンス）することだよ。", explanation: "コーポレートガバナンスは株主や社外役員などの視点から経営陣を監視・統制し、健全で透明性の高い経営を実現する仕組みです。" },
        { question: "【ストラテジ】企業が法律や規則だけでなく、社会的な倫理や社内ルールまで含めて守ることを何と呼びますか？", choices: ["コンプライアンス", "アカウンタビリティ", "ダイバーシティ", "メセナ"], correctIndex: 0, hint: "日本語では「法令遵守」と訳されることが多いよ。", explanation: "コンプライアンスは法令だけでなく、企業倫理や社内規程などのルールを遵守することです。" },
        { question: "【ストラテジ】他人のIDやパスワードを無断で使ってネットワーク上のコンピュータに侵入する行為を処罰する法律はどれですか？", choices: ["不正アクセス禁止法", "著作権法", "プロバイダ責任制限法", "電子署名法"], correctIndex: 0, hint: "許可なく他人のアカウントでアクセスすることを禁じる法律だよ。", explanation: "不正アクセス禁止法は、他人のID・パスワードの無断利用や脆弱性を突く行為による不正アクセスを禁止・処罰する法律です。" },
        { question: "【ストラテジ】スーパーやコンビニのレジで、商品が売れた時点の販売情報をリアルタイムに記録・集計するシステムはどれですか？", choices: ["POSシステム", "GPSシステム", "EDI", "CAD"], correctIndex: 0, hint: "Point of Sale（販売時点情報管理）の略だよ。", explanation: "POSシステムは販売時点の単品ごとのデータを記録・集計し、仕入れや商品企画、在庫管理などに活用する仕組みです。" },
        { question: "【ストラテジ】商品のラベルやタグに埋め込まれたICチップから、電波を使って非接触でデータを読み書きする技術はどれですか？", choices: ["RFID", "QRコード", "バーコード", "OCR"], correctIndex: 0, hint: "交通系ICカードやユニクロのセルフレジなどで使われている無線自動識別技術だよ。", explanation: "RFIDは電波を用いてICタグと非接触でデータをやり取りする技術で、一括読み取りなどが可能です。" },

        { question: "【ストラテジ】企業の社会的責任を意味し、利益の追求だけでなく環境保護や社会貢献活動に取り組む考え方はどれですか？", choices: ["CSR", "CSV", "ROI", "M&A"], correctIndex: 0, hint: "Corporate Social Responsibility の略称だよ。", explanation: "CSRは企業が利益追求だけでなく、環境保全や人権・社会貢献など社会的責任を果たす考え方です。" },
        { question: "【ストラテジ】複数の企業を買収・合併することで、事業の拡大や新規分野への参入をスピーディに行う経営戦略はどれですか？", choices: ["M&A", "OEM", "BPO", "IPO"], correctIndex: 0, hint: "Mergers（合併）and Acquisitions（買収）の略だよ。", explanation: "M&Aは企業の合併や買収を通じて事業規模拡大や技術・人材の獲得、新規市場参入などを図る手法です。" },
        { question: "【ストラテジ】市場成長率と相対的市場占有率の2軸で自社の事業を「花形」「金のなる木」「問題児」「負け犬」に分類する分析手法はどれですか？", choices: ["PPM（プロダクトポートフォリオマネジメント）", "SWOT分析", "3C分析", "バリューチェーン分析"], correctIndex: 0, hint: "資金配分を決めるための4象限マトリクス分析だよ。", explanation: "PPMは市場成長率と市場占有率の2軸で事業を4つに分類し、どこへ資金を重点配分するかを判断する手法です。" },
        { question: "【ストラテジ】企業同士が受発注データや請求データなどを、専用線やインターネットを通じて電子的に直接交換する仕組みはどれですか？", choices: ["EDI（電子データ交換）", "EUC", "ERP", "SNS"], correctIndex: 0, hint: "Electronic Data Interchange の略称だよ。", explanation: "EDIは異なる企業間で商取引データを標準化された規約に基づいて電子交換する仕組みです。" },
        { question: "【ストラテジ】自社の業務プロセスそのものを根本から見直し、職務や組織を再設計して劇的な改善を図る手法はどれですか？", choices: ["BPR（ビジネスプロセス・リエンジニアリング）", "BCP", "BPM", "OJT"], correctIndex: 0, hint: "業務の流れ（ビジネスプロセス）をゼロから作り直す（リエンジニアリング）ことだよ。", explanation: "BPRは既存の業務手順を部分改善するだけでなく、業務フローや組織のあり方を抜本的に再設計する手法です。" },
        { question: "【マネジメント】縦軸に作業項目、横軸に日程をとり、各作業の予定と進捗状況を横棒グラフで表したスケジュール管理表はどれですか？", choices: ["ガントチャート", "パレート図", "散布図", "特性要因図"], correctIndex: 0, hint: "スケジュール管理で最もよく使われる横棒の工程表だよ。", explanation: "ガントチャートは作業ごとの開始・終了予定や進捗を横棒で視覚化するスケジュール管理表です。" },
        { question: "【マネジメント】情報システムが安全かつ効率的に運用されているかを、独立した専門家が客観的に点検・評価する活動はどれですか？", choices: ["システム監査", "システム開発", "ペネトレーションテスト", "システム運用"], correctIndex: 0, hint: "第三者の目でシステムの健全性をチェック・監査することだよ。", explanation: "システム監査は開発・運用部門から独立した監査人がリスクや統制状況を客観的に評価し、改善を勧告する活動です。" },
        { question: "【マネジメント】プログラムの部品（モジュール）同士を組み合わせて、インターフェースやデータの受け渡しが正しく動かせるか確認するテストはどれですか？", choices: ["結合テスト", "単体テスト", "運用テスト", "受入テスト"], correctIndex: 0, hint: "部品と部品を「つなげる（結合する）」テストだよ。", explanation: "結合テストは複数のモジュールを組み合わせ、連携やデータの受け渡しに問題がないかを確認する工程です。" },
        { question: "【マネジメント】システム開発の初期段階で、試作品（プロトタイプ）を素早く作成して利用者に確認してもらいながら要件を固める手法はどれですか？", choices: ["プロトタイピングモデル", "ウォーターフォールモデル", "V字モデル", "RAD"], correctIndex: 0, hint: "「試作品（プロトタイプ）」を作って意見をもらう開発手法だよ。", explanation: "プロトタイピングモデルは画面や機能の試作を早期に作って利用者のイメージをすり合わせながら要件を明確化する手法です。" },
        { question: "【マネジメント】システム開発における「要件定義」とは、主に何を決める工程ですか？", choices: ["システムに実装すべき機能や性能など、利用者の要望を明確にする", "プログラムの具体的なコードを記述する", "サーバーの機器をデータセンターに設置する", "完成したシステムの操作マニュアルを配布する"], correctIndex: 0, hint: "開発を始める一番最初に「何を作るか」の条件を定義する工程だよ。", explanation: "要件定義は業務や利用者の要求を整理し、システムに必要な機能・性能・制約などの要件を明確にする上流工程です。" },

        { question: "【マネジメント】システム稼働後に、法改正への対応や不具合の修正、機能改善を行う工程を何と呼びますか？", choices: ["システム保守（メンテナンス）", "システム設計", "要件定義", "単体テスト"], correctIndex: 0, hint: "リリースしたシステムを良い状態に保ち、手入れする作業だよ。", explanation: "システム保守は稼働開始後の不具合修正、法改正や環境変化への対応、機能追加・改善を行う工程です。" },
        { question: "【マネジメント】プロジェクトの「スコープ」とは、管理上どのような意味で使われますか？", choices: ["プロジェクトで実施する作業の範囲や成果物の範囲", "プロジェクトにかかる総予算", "プロジェクトに参加するメンバーの人数", "システムの処理速度"], correctIndex: 0, hint: "「どこまでやるか」という作業範囲のことだよ。", explanation: "スコープはプロジェクトで達成すべき成果物や実施する作業の範囲を指し、明確にしておかないとスコープクリープ（範囲膨張）が起きます。" },
        { question: "【マネジメント】プロジェクトの重要な節目（中間目標地点）のことを何と呼びますか？", choices: ["マイルストーン", "クリティカルパス", "ベースライン", "バッファ"], correctIndex: 0, hint: "道路の距離標（マイルストーン）が語源の、スケジュール上の重要な区切りだよ。", explanation: "マイルストーンは工程表における重要な節目やチェックポイント（設計完了、テスト開始など）のことです。" },
        { question: "【マネジメント】プログラムを実際に動かさずに、設計書やソースコードを複数人で読み合って誤りを見つける手法はどれですか？", choices: ["レビュー（インスペクション/ウォークスルー）", "ブラックボックステスト", "負荷テスト", "回帰テスト"], correctIndex: 0, hint: "人間が目で見て点検・批評（レビュー）する作業だよ。", explanation: "レビューは成果物（仕様書・設計書・コードなど）を関係者が点検し、誤りや漏れを早期に発見する手法です。" },
        { question: "【マネジメント】システム開発で、発注側（ユーザー企業）が「自社の業務で問題なく使えるか」を最終的に確認するテストはどれですか？", choices: ["受入テスト（運用テスト）", "単体テスト", "結合テスト", "ホワイトボックステスト"], correctIndex: 0, hint: "納品されたシステムを発注者が「受け入れる」ための最終テストだよ。", explanation: "受入テストは発注者側が要件や業務運用に適合しているかを最終確認し、検収・本番移行につなげるテストです。" },
        { question: "【テクノロジ】実在する銀行や通販サイトなどを装った偽メールを送りつけ、偽サイトへ誘導してIDやカード番号を盗む手口はどれですか？", choices: ["フィッシング詐欺", "ワンクリック詐欺", "標的型攻撃", "DDoS攻撃"], correctIndex: 0, hint: "偽の餌で個人情報を釣り上げる（Fishing）詐欺だよ。", explanation: "フィッシング詐欺は正規サービスを装うメールやメッセージから偽サイトへ誘導し、認証情報やカード番号などを入力させる手口です。" },
        { question: "【テクノロジ】技術的な攻撃ではなく、肩越しに画面を覗いたり電話で聞き出したりして人間の隙から秘密情報を盗む手法はどれですか？", choices: ["ソーシャルエンジニアリング", "SQLインジェクション", "クロスサイトスクリプティング", "ゼロデイ攻撃"], correctIndex: 0, hint: "人間の心理や行動の隙を突くアナログな攻撃手法だよ。", explanation: "ソーシャルエンジニアリングは技術的突破ではなく、人の油断や心理（親切心・焦りなど）につけ込んで情報を引き出す手法です。" },
        { question: "【テクノロジ】パスワード（知識）だけでなく、スマホのSMS認証（所持）や指紋認証（生体）などを組み合わせて安全性を高める仕組みはどれですか？", choices: ["二要素認証（多要素認証）", "シングルサインオン", "CAPTCHA認証", "基本認証"], correctIndex: 0, hint: "異なる2つ以上の要素を使って本人確認をする仕組みだよ。", explanation: "多要素認証（二要素認証）は「知識・所持・生体」など異なる種類の認証要素を組み合わせることで、パスワード流出時の被害を抑えます。" },
        { question: "【テクノロジ】社内ネットワークとインターネットの境界に設置し、不正なアクセスや怪しい通信を遮断する「防火壁」の仕組みはどれですか？", choices: ["ファイアウォール", "プロキシサーバー", "ルータ", "ロードバランサ"], correctIndex: 0, hint: "直訳すると「防火壁」という意味のセキュリティ装置だよ。", explanation: "ファイアウォールは送信元・宛先・ポートなどのルールに基づいて通過する通信を制御し、不正アクセスを防ぎます。" },
        { question: "【テクノロジ】インターネット上に仮想の専用線を作り、通信を暗号化することで外出先からでも安全に社内LANへ接続できる技術はどれですか？", choices: ["VPN（仮想私設網）", "VLAN", "WAN", "VoIP"], correctIndex: 0, hint: "Virtual Private Network の略称だよ。", explanation: "VPNは公衆回線上に暗号化された仮想の専用通信路を構築し、離れた拠点や外出先から安全に社内ネットワークへ接続する技術です。" },

        { question: "【テクノロジ】クラウドサービスの提供形態のうち、GmailやGoogleドライブのように完成したアプリケーションをネット経由で提供する形態はどれですか？", choices: ["SaaS（サース）", "PaaS（パース）", "IaaS（イアース）", "DaaS"], correctIndex: 0, hint: "Software as a Service（ソフトウェアの提供）の略だよ。", explanation: "SaaSは完成したソフトウェア機能をクラウド経由で提供する形態です。PaaSは開発・実行基盤、IaaSは仮想サーバーやストレージ等のインフラを提供します。" },
        { question: "【テクノロジ】クラウドサービスの提供形態のうち、仮想サーバーやネットワークなどのインフラ基盤を提供する形態はどれですか？", choices: ["IaaS（イアース）", "SaaS", "PaaS", "ASP"], correctIndex: 0, hint: "Infrastructure as a Service（インフラの提供）の略だよ。", explanation: "IaaSはCPU・メモリ・ストレージ・ネットワークなどのITインフラを仮想化して提供し、OSやミドルウェア、アプリは利用者が管理します。" },
        { question: "【テクノロジ】家電、車、工場の機械などあらゆる「モノ」がインターネットにつながり、データの収集や遠隔操作ができる仕組みはどれですか？", choices: ["IoT（モノのインターネット）", "AI", "VR", "RPA"], correctIndex: 0, hint: "Internet of Things の略称だよ。", explanation: "IoTはセンサーや通信機能を備えた機器・設備がネットワークにつながり、状態データの収集や監視・制御を行う仕組みです。" },
        { question: "【テクノロジ】大量のデータからコンピュータが自らルールやパターンを学習し、予測や判断を行うAIの基盤技術はどれですか？", choices: ["機械学習（マシンラーニング）", "ブロックチェーン", "エッジコンピューティング", "量子コンピュータ"], correctIndex: 0, hint: "マシン（機械）がデータをラーニング（学習）する技術だよ。", explanation: "機械学習はデータから特徴やパターンを学習してモデルを作り、未知のデータに対する予測や分類・判断を行う技術です。" },
        { question: "【テクノロジ】パソコンで行う定型的な事務作業（データ入力や転記など）を、ソフトウェアのロボットによって自動化する技術はどれですか？", choices: ["RPA", "ERP", "CRM", "CMS"], correctIndex: 0, hint: "Robotic Process Automation の略称だよ。", explanation: "RPAは定型的なPC操作や業務プロセスをソフトウェアロボットに代行させて自動化する技術です。" },
        { question: "【テクノロジ】取引履歴を暗号技術によって鎖のようにつなぎ、分散型台帳で管理することで改ざんを極めて困難にする技術はどれですか？", choices: ["ブロックチェーン", "データベース", "クラウドストレージ", "キャッシュメモリ"], correctIndex: 0, hint: "ビットコインなどの暗号資産（仮想通貨）の基盤になっている技術だよ。", explanation: "ブロックチェーンは取引データをブロック単位で暗号技術を用いて連結し、複数ノードで分散管理することで改ざん耐性を高める技術です。" },
        { question: "【テクノロジ】1度のログイン認証だけで、連携する複数のWebサービスや業務システムを利用できるようになる仕組みはどれですか？", choices: ["シングルサインオン（SSO）", "二段階認証", "生体認証", "アクセス制御"], correctIndex: 0, hint: "1回（シングル）のサインオンで全部使える便利な仕組みだよ。", explanation: "SSOは一度の認証で複数の対象システム・サービスへ再入力なしでアクセスできるようにする仕組みです。" },
        { question: "【テクノロジ】ネットワーク上の機器に、重複しないIPアドレスを自動的に割り振るプロトコルはどれですか？", choices: ["DHCP", "DNS", "SMTP", "POP3"], correctIndex: 0, hint: "Wi-Fiにつないだ時に自動でIPアドレスを配ってくれる仕組みだよ。", explanation: "DHCPはネットワーク接続時にIPアドレスやサブネットマスク、デフォルトゲートウェイなどの設定を自動割り当てするプロトコルです。" },
        { question: "【テクノロジ】電子メールを送信するときや、メールサーバー間でメールを転送するときに使われるプロトコルはどれですか？", choices: ["SMTP", "POP3", "IMAP", "HTTP"], correctIndex: 0, hint: "Simple Mail Transfer Protocol（メール転送）の略だよ。", explanation: "SMTPはメールの送信・サーバー間転送に使われるプロトコルです。メール受信にはPOP3やIMAPが使われます。" },
        { question: "【テクノロジ】指紋、虹彩、静脈、顔など、人間の身体的特徴を使って本人確認を行う認証方式はどれですか？", choices: ["生体認証（バイオメトリクス認証）", "知識認証", "所有物認証", "ワンタイムパスワード"], correctIndex: 0, hint: "体の一部（生体情報）を使う認証方式だよ。", explanation: "生体認証は指紋・顔・静脈・虹彩などの身体的・行動的特徴を用いる認証方式で、紛失や忘れにくい利点があります。" },

        { question: "【テクノロジ】情報を扱う上で重要な「機密性・完全性・可用性」のうち、「データが改ざんされたり破壊されたりしていない状態」はどれですか？", choices: ["完全性（Integrity）", "機密性（Confidentiality）", "可用性（Availability）", "責任追跡性"], correctIndex: 0, hint: "データが欠けたり書き換えられたりせず「完全」な状態であることだよ。", explanation: "完全性は情報が正確かつ完全であり、不正な改ざんや破損がない状態を維持することです。" },

        }
        return {
            question: `${prefix}${desc}を表す用語・概念として、最も適切なものはどれですか？`,

    function formatTime(totalSec) {
        const safeSec = Math.max(0, totalSec);
        const mins = Math.floor(safeSec / 60);
        const secs = safeSec % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

            timerBar.classList.remove("timer-warning");

    function renderGlossary(filterText = "") {
        const container = document.getElementById("glossary-list-container");
        container.innerHTML = "";
        const keyword = filterText.toLowerCase();

        const filtered = glossaryData.filter(item => 
            item.term.toLowerCase().includes(keyword) || 
            item.desc.toLowerCase().includes(keyword) ||
            item.cat.includes(keyword)
        );

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">該当する用語が見つかりませんでした。</p>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement("div");
            div.className = "glossary-item";
            div.innerHTML = `
                <div class="glossary-term">
                    <span class="glossary-tag ${item.cls}">${item.cat}</span>
                    ${item.term}
                </div>
                <p class="glossary-desc">${item.desc}</p>
            `;
            container.appendChild(div);
        });
    }

        document.getElementById("screen-end").classList.add("hidden");

    function shuffleArray(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            let temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
        }
        return copy;
    }

        const currentQuiz = playList[currentQuizIndex];
        const hintBox = document.getElementById("lbl-hint");
        hintBox.textContent = `💡 ヒント: ${currentQuiz.hint}`;
        hintBox.classList.remove("hidden");
    }

    function selectChoice(selectedIndex) {
        const currentQuiz = playList[currentQuizIndex];
        const choiceButtons = document.querySelectorAll(".btn-choice");
        const btnNext = document.getElementById("btn-next");
        const expBox = document.getElementById("lbl-explanation");
        const correctLabel = `${currentQuiz.correctIndex + 1}. ${currentQuiz.choices[currentQuiz.correctIndex]}`;
        const selectedLabel = `${selectedIndex + 1}. ${currentQuiz.choices[selectedIndex]}`;

        choiceButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQuiz.correctIndex) {
            document.getElementById("lbl-result").textContent = "⭕ 正解！素晴らしい！";
            document.getElementById("lbl-result").style.color = "#28a745";
            choiceButtons[selectedIndex].style.backgroundColor = "#28a745";
            choiceButtons[selectedIndex].style.color = "#ffffff";
            correctCount++;
            expBox.textContent = `📘 解説\n正解は「${correctLabel}」です。\n${currentQuiz.explanation}`;
        } else {
            document.getElementById("lbl-result").textContent = `❌ 残念！正解は ${currentQuiz.correctIndex + 1} です。`;
            document.getElementById("lbl-result").style.color = "#dc3545";
            choiceButtons[selectedIndex].style.backgroundColor = "#dc3545";
            choiceButtons[selectedIndex].style.color = "#ffffff";
            choiceButtons[currentQuiz.correctIndex].style.backgroundColor = "#28a745";
            choiceButtons[currentQuiz.correctIndex].style.color = "#ffffff";
            expBox.textContent = `📘 解説\nあなたが選んだ「${selectedLabel}」ではなく、正解は「${correctLabel}」です。\n${currentQuiz.explanation}`;
        }

        expBox.classList.remove("hidden");
        btnNext.disabled = false;
    }

    function nextQuestion() {
        currentQuizIndex++;

        if (currentMode === 'endless' && currentQuizIndex >= playList.length) {
            playList = shuffleArray(quizList);
            currentQuizIndex = 0;
        }

        if (currentQuizIndex < playList.length) {
            showQuiz();
        } else {
            endQuizScreen();
        }
    }

    function endQuizScreen() {
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-end").classList.remove("hidden");

        document.getElementById("lbl-end-title").textContent = "クイズ終了！";
        document.getElementById("lbl-final-score").textContent = 
            `お疲れ様でした！\n\nあなたの成績：${playList.length}問中 ${correctCount}問 正解！`;
    }

    function startTestMode(questionCount, withTimer) {
        stopTimer();
        isFullTest = withTimer;
        testQuestions = shuffleArray(quizList).slice(0, questionCount);
        const container = document.getElementById("test-questions-container");
        container.innerHTML = "";

        document.getElementById("lbl-test-title").textContent = withTimer
            ? `本格テスト（全${questionCount}問・制限時間120分）`
            : `模擬テスト（全${questionCount}問）`;

        document.getElementById("lbl-test-notice").textContent = withTimer
            ? `⚠️ 本格テスト中はヒントおよび用語集を使用できません。制限時間は120分です。`
            : `⚠️ テスト中はヒントおよび用語集を使用できません。全${questionCount}問に回答して採点してください。`;

        const timerBar = document.getElementById("test-timer-bar");
        if (withTimer) {
            remainingSeconds = 120 * 60;
            timerBar.classList.remove("hidden");
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    stopTimer();
                    alert("制限時間（120分）が終了しました。現在の回答で採点します。");
                    gradeTestMode(true);
                }
            }, 1000);
        } else {
            timerBar.classList.add("hidden");
        }

        document.getElementById("test-result-area").classList.add("hidden");
        document.getElementById("test-result-area").innerHTML = "";
        document.getElementById("btn-submit-test-top").classList.remove("hidden");
        document.getElementById("btn-test-back-top").classList.add("hidden");
        document.getElementById("btn-test-quit-top").classList.remove("hidden");
        document.getElementById("btn-submit-test").classList.remove("hidden");
        document.getElementById("btn-test-back").classList.add("hidden");

        testQuestions.forEach((q, qIdx) => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "test-item";
            itemDiv.id = `test-item-${qIdx}`;

            let choicesHtml = "";
            q.choices.forEach((choice, cIdx) => {
                choicesHtml += `
                    <label class="test-choice-label" id="test-label-${qIdx}-${cIdx}">
                        <input type="radio" name="test-q-${qIdx}" value="${cIdx}">
                        ${cIdx + 1}. ${choice}
                    </label>
                `;
            });

            itemDiv.innerHTML = `
                <div class="test-q-title">第 ${qIdx + 1} 問</div>
                <div class="test-q-text">${q.question}</div>
                <div>${choicesHtml}</div>
                <div id="test-fb-${qIdx}" class="test-feedback hidden"></div>
            `;
            container.appendChild(itemDiv);
        });

        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-test").classList.remove("hidden");
        document.getElementById("screen-end").classList.add("hidden");
        window.scrollTo(0, 0);
    }

    function gradeTestMode(forceSubmit = false) {
        if (!forceSubmit) {
            let unanswered = [];
            for (let i = 0; i < testQuestions.length; i++) {
                const selected = document.querySelector(`input[name="test-q-${i}"]:checked`);
                if (!selected) {
                    unanswered.push(i + 1);
                }
            }

            if (unanswered.length > 0) {
                if (isFullTest) {
                    const proceed = confirm(`第 ${unanswered.join(", ")} 問が未回答です。このまま採点しますか？`);
                    if (!proceed) return;
                } else {
                    alert(`第 ${unanswered.join(", ")} 問が未回答です。すべての問題に回答してから採点してください。`);
                    return;
                }
            }
        }

        stopTimer();

        let score = 0;
        const total = testQuestions.length;
        testQuestions.forEach((q, qIdx) => {
            const selected = document.querySelector(`input[name="test-q-${qIdx}"]:checked`);
            const userAns = selected ? parseInt(selected.value, 10) : null;
            const fbDiv = document.getElementById(`test-fb-${qIdx}`);
            const correctLabel = `${q.correctIndex + 1}. ${q.choices[q.correctIndex]}`;

            const radios = document.querySelectorAll(`input[name="test-q-${qIdx}"]`);
            radios.forEach(r => r.disabled = true);

            if (userAns === q.correctIndex) {
                score++;
                fbDiv.textContent = `⭕ 正解！`;
                fbDiv.className = "test-feedback fb-correct";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.backgroundColor = "#d4edda";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.borderColor = "#28a745";
            } else {
                fbDiv.textContent = userAns !== null
                    ? `❌ 不正解（正解は ${correctLabel}）`
                    : `❌ 未回答（正解は ${correctLabel}）`;
                fbDiv.className = "test-feedback fb-wrong";
                if (userAns !== null) {
                    document.getElementById(`test-label-${qIdx}-${userAns}`).style.backgroundColor = "#f8d7da";
                    document.getElementById(`test-label-${qIdx}-${userAns}`).style.borderColor = "#dc3545";
                }
                document.getElementById(`test-label-${qIdx}-${q.correctIndex}`).style.backgroundColor = "#d4edda";
                document.getElementById(`test-label-${qIdx}-${q.correctIndex}`).style.borderColor = "#28a745";
            }
        });

        const percentage = Math.round((score / total) * 100);
        const resultArea = document.getElementById("test-result-area");
        const passMsg = percentage >= 60 ? "🎉 合格ライン（60%以上）達成！素晴らしい実力です！" : "📚 あと少し！間違えた問題を見直して再挑戦しよう！";
        resultArea.innerHTML = `
            <h2 style="margin:0 0 10px 0; color:#333;">採点結果：${total}問中 ${score} 問正解（${percentage}点）</h2>
            <p style="margin:0; font-weight:bold; color:${percentage >= 60 ? '#28a745' : '#dc3545'};">${passMsg}</p>
        `;
        resultArea.classList.remove("hidden");

        document.getElementById("btn-submit-test-top").classList.add("hidden");
        document.getElementById("btn-test-back-top").classList.remove("hidden");
        document.getElementById("btn-test-quit-top").classList.add("hidden");
        document.getElementById("btn-submit-test").classList.add("hidden");
        document.getElementById("btn-test-back").classList.remove("hidden");

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openGlossary() {
        document.getElementById("input-glossary-search").value = "";
        renderGlossary();
        document.getElementById("modal-glossary").classList.remove("hidden");
    }

    function closeGlossary() {
        document.getElementById("modal-glossary").classList.add("hidden");
    }
</script>

</body>
</html>
