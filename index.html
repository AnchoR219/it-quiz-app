<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITパスポート クイズDX（大容量用語集・全80語対応）</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .quiz-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .progress {
            font-size: 14px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge-mode {
            background-color: #e9ecef;
            color: #495057;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .question-text {
            font-size: 16px;
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .choices-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-choice {
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #007bff;
            background-color: #ffffff;
            color: #007bff;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-choice:hover:not(:disabled) {
            background-color: #007bff;
            color: #ffffff;
        }

        .btn-choice:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-hint {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn-hint:hover {
            background-color: #e0a800;
        }

        .hint-box {
            background-color: #fff9db;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            font-size: 14px;
            color: #856404;
            margin-bottom: 15px;
            border-radius: 4px;
            line-height: 1.5;
        }

        .result-message {
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            min-height: 27px;
            line-height: 1.4;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background-color: #28a745;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 10px;
        }
        .btn-action:hover:not(:disabled) {
            background-color: #218838;
        }
        .btn-action:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .btn-strategy { background-color: #17a2b8; }
        .btn-strategy:hover { background-color: #138496; }

        .btn-management { background-color: #fd7e14; }
        .btn-management:hover { background-color: #e86b05; }

        .btn-technology { background-color: #6f42c1; }
        .btn-technology:hover { background-color: #5a32a3; }

        .btn-endless {
            background-color: #20c997;
        }
        .btn-endless:hover {
            background-color: #1ba87e;
        }

        .btn-test {
            background-color: #dc3545;
        }
        .btn-test:hover {
            background-color: #c82333;
        }

        .btn-glossary-open {
            background-color: #6c757d;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn-glossary-open:hover {
            background-color: #5a6268;
        }

        .btn-quit {
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            display: block;
            margin: 10px auto 0;
        }

        /* 模擬テストモード専用スタイル */
        .test-header-notice {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .test-item {
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .test-q-title {
            font-weight: bold;
            color: #007bff;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .test-q-text {
            font-size: 15px;
            color: #2c3e50;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .test-choice-label {
            display: block;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.15s;
        }
        .test-choice-label:hover {
            background-color: #f1f3f5;
        }
        .test-choice-label input {
            margin-right: 8px;
        }

        .test-result-box {
            background-color: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .test-feedback {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .fb-correct {
            background-color: #d4edda;
            color: #155724;
        }
        .fb-wrong {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* 用語集モーダル */
        .glossary-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .glossary-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .glossary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .glossary-header h2 {
            margin: 0;
            font-size: 20px;
            color: #333;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .glossary-search {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        .glossary-search:focus {
            border-color: #007bff;
        }

        .glossary-list {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .glossary-item {
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f1f1;
        }

        .glossary-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            color: #fff;
        }
        .tag-st { background-color: #17a2b8; }
        .tag-mg { background-color: #fd7e14; }
        .tag-tc { background-color: #6f42c1; }

        .glossary-term {
            font-weight: bold;
            color: #007bff;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }

        .glossary-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin: 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- タイトル画面 -->
    <div id="screen-start">
        <h1>ITパスポート クイズDX</h1>
        <p class="subtitle">
            全100問＆大容量用語集（全80語）搭載！学習スタイルや分野別に選んで学べます。
        </p>
        <button class="btn-action" onclick="startQuiz('normal')">
            📝 10問ランダムチャレンジ
        </button>
        <button class="btn-action btn-strategy" onclick="startQuiz('strategy')">
            🏢 ストラテジ系 分野別チャレンジ
        </button>
        <button class="btn-action btn-management" onclick="startQuiz('management')">
            📊 マネジメント系 分野別チャレンジ
        </button>
        <button class="btn-action btn-technology" onclick="startQuiz('technology')">
            💻 テクノロジ系 分野別チャレンジ
        </button>
        <button class="btn-action btn-endless" onclick="startQuiz('endless')">
            🔥 エンドレスモード（失敗しても無限に解ける）
        </button>
        <button class="btn-action btn-test" onclick="startTestMode()">
            ⏱️ 模擬テストモード（10問一括・ヒント/用語集なし）
        </button>
        <hr style="border: none; border-top: 1px solid #eee; margin: 15px 0;">
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を見る（全80語・検索対応）</button>
    </div>

    <!-- 通常＆エンドレス＆分野別 クイズ画面 -->
    <div id="screen-quiz" class="hidden">
        <div class="progress">
            <span id="lbl-progress">第 1 問 / 全 10 問</span>
            <span id="lbl-mode-badge" class="badge-mode">モード</span>
        </div>
        <div id="lbl-question" class="question-text"></div>
        
        <button class="btn-hint" onclick="showHint()">💡 ヒントを見る</button>
        <div id="lbl-hint" class="hint-box hidden"></div>

        <div class="choices-grid">
            <button class="btn-choice" onclick="selectChoice(0)"></button>
            <button class="btn-choice" onclick="selectChoice(1)"></button>
            <button class="btn-choice" onclick="selectChoice(2)"></button>
            <button class="btn-choice" onclick="selectChoice(3)"></button>
        </div>

        <div id="lbl-result" class="result-message"></div>
        <button id="btn-next" class="btn-action" onclick="nextQuestion()" disabled>次の問題へ</button>
        
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を開いて確認する</button>
        <button class="btn-quit" onclick="showStartScreen()">タイトルに戻る</button>
    </div>

    <!-- 模擬テストモード画面 -->
    <div id="screen-test" class="hidden">
        <h1>模擬テスト（全10問）</h1>
        <div class="test-header-notice">
            ⚠️ テスト中はヒントおよび用語集を使用できません。全10問に回答して採点してください。
        </div>
        <div id="test-result-area" class="test-result-box hidden"></div>
        <div id="test-questions-container"></div>
        <button id="btn-submit-test" class="btn-action btn-test" onclick="gradeTestMode()">回答を提出して採点する</button>
        <button id="btn-test-back" class="btn-action hidden" onclick="showStartScreen()">タイトルに戻る</button>
        <button id="btn-test-quit" class="btn-quit" onclick="showStartScreen()">テストを中断して戻る</button>
    </div>

    <!-- 終了画面 -->
    <div id="screen-end" class="hidden">
        <h1 id="lbl-end-title">クイズ終了！</h1>
        <p id="lbl-final-score" class="question-text" style="text-align: center; font-size: 18px;"></p>
        <button class="btn-action" onclick="showStartScreen()">タイトルに戻る</button>
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を復習する</button>
    </div>
</div>

<!-- 用語集モーダルウィンドウ -->
<div id="modal-glossary" class="glossary-modal hidden">
    <div class="glossary-content">
        <div class="glossary-header">
            <h2>ITパスポート頻出 用語集（全80語）</h2>
            <button class="btn-close" onclick="closeGlossary()">×</button>
        </div>
        <input type="text" id="input-glossary-search" class="glossary-search" placeholder="🔍 キーワードで検索（例：セキュリティ、クラウド、AI...）" onkeyup="filterGlossary()">
        <div id="glossary-list-container" class="glossary-list"></div>
        <button class="btn-action" style="margin-top: 15px; margin-bottom: 0;" onclick="closeGlossary()">閉じる</button>
    </div>
</div>

<script>
    // 全80語の超大容量用語データ
    const glossaryData = [
        // ストラテジ系
        { cat: "ストラテジ", cls: "tag-st", term: "DX（デジタルトランスフォーメーション）", desc: "デジタル技術を活用して、ビジネスモデルや業務プロセス、組織文化などを根本から変革し、競争上の優位性を確立すること。" },
        { cat: "ストラテジ", cls: "tag-st", term: "BCP（事業継続計画）", desc: "自然災害やシステム障害などの緊急事態が発生した際、損害を最小限に抑えつつ中核事業を継続・早期復旧させるための事前計画。" },
        { cat: "ストラテジ", cls: "tag-st", term: "SWOT分析", desc: "自社の「強み(S)・弱み(W)」と外部環境の「機会(O)・脅威(T)」の4つの軸で現状を整理し、経営戦略を立てる分析手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "PDCAサイクル", desc: "Plan（計画）→ Do（実行）→ Check（評価）→ Act（改善）の4段階を繰り返し、業務を継続的に改善する手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "KPI / KGI", desc: "KGIは「重要目標達成指標（最終ゴール）」、KPIはそこに至るまでの過程を計測する「重要業績評価指標（中間目標）」のこと。" },
        { cat: "ストラテジ", cls: "tag-st", term: "ERP（企業資源計画）", desc: "会計・人事・生産・販売などの企業全体の経営資源を一元管理し、経営効率を高める統合基幹業務システム。" },
        { cat: "ストラテジ", cls: "tag-st", term: "CRM（顧客関係管理）", desc: "顧客の属性や購買履歴などを管理・分析し、一人ひとりに最適な対応を行うことで顧客満足度やリピート率を高める手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "SCM（サプライチェーンマネジメント）", desc: "原材料の調達から製造、在庫管理、配送、販売までのモノの流れ全体を最適化し、コスト削減や納期短縮を図る経営手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "OEM", desc: "相手先ブランドによる生産のこと。他社ブランドの製品を製造すること、または自社で工場を持たず他社に製造を委託する形態。" },
        { cat: "ストラテジ", cls: "tag-st", term: "アウトソーシング", desc: "自社の業務やシステム運用などの一部を、外部の専門企業に委託すること。" },
        { cat: "ストラテジ", cls: "tag-st", term: "コーポレートガバナンス", desc: "企業経営の透明性や公正性を確保するために、株主や社外取締役などが経営陣を監視・統制する仕組み（企業統治）。" },
        { cat: "ストラテジ", cls: "tag-st", term: "内部統制", desc: "企業が法令を遵守し、業務の有効性・効率性を高め、不正やミスを防ぐために社内で構築・運用する管理・チェック体制。" },
        { cat: "ストラテジ", cls: "tag-st", term: "コンプライアンス", desc: "企業が法律や規則を守るだけでなく、社会的な倫理や道徳、社内ルールまで含めて遵守すること（法令遵守）。" },
        { cat: "ストラテジ", cls: "tag-st", term: "NDA（秘密保持契約）", desc: "ビジネスの取引や業務委託の際に、知り得た機密情報を第三者に漏らさないことを約束する契約。" },
        { cat: "ストラテジ", cls: "tag-st", term: "著作権", desc: "小説、イラスト、音楽、プログラムなどの著作物を創作した人が持つ権利。無断での複製・改変・公開を禁止します。" },
        { cat: "ストラテジ", cls: "tag-st", term: "特許権 / 商標権 / 意匠権", desc: "特許権は「高度な発明」、商標権は「商品名やロゴマーク」、意匠権は「製品のデザイン・外観」を保護する知的財産権。" },
        { cat: "ストラテジ", cls: "tag-st", term: "個人情報保護法", desc: "氏名・住所・マイナンバーなど個人を特定できる情報の適正な取り扱いを企業などに義務づけた日本の法律。" },
        { cat: "ストラテジ", cls: "tag-st", term: "不正アクセス禁止法", desc: "他人のID・パスワードを無断で使ったり、セキュリティの穴を突いてコンピュータに侵入したりする行為を罰する法律。" },
        { cat: "ストラテジ", cls: "tag-st", term: "プライバシーマーク（Pマーク）", desc: "個人情報の保護体制が適切に整備されていると評価された事業者に付与される認証マーク。" },
        { cat: "ストラテジ", cls: "tag-st", term: "グリーンIT", desc: "省エネ性能の高い機器の導入やペーパーレス化など、地球環境への負荷を減らすITの設計・活用。" },
        { cat: "ストラテジ", cls: "tag-st", term: "フィンテック（FinTech）", desc: "金融（Finance）と技術（Technology）を融合させた、スマホ決済や家計簿アプリ、仮想通貨などの新しい金融サービス。" },
        { cat: "ストラテジ", cls: "tag-st", term: "サブスクリプション", desc: "製品を買い切るのではなく、利用期間に応じて定額料金を支払うビジネスモデル（動画配信やクラウドソフトなど）。" },
        { cat: "ストラテジ", cls: "tag-st", term: "POSシステム", desc: "スーパーやコンビニのレジで、商品が売れた時点の販売情報をリアルタイムに記録・集計するシステム。" },
        { cat: "ストラテジ", cls: "tag-st", term: "RFID", desc: "ICチップとアンテナを内蔵したタグから、電波を使って非接触でデータを読み書きする自動認識技術。" },
        { cat: "ストラテジ", cls: "tag-st", term: "CSR", desc: "企業の社会的責任。利益追求だけでなく、環境保護や社会貢献などステークホルダーに対する責任を果たすこと。" },
        { cat: "ストラテジ", cls: "tag-st", term: "M&A", desc: "企業の合併（Mergers）と買収（Acquisitions）の総称。事業拡大や経営基盤の強化を目的として行われる。" },
        { cat: "ストラテジ", cls: "tag-st", term: "PPM分析", desc: "市場成長率と市場占有率の2軸で自社の事業ポートフォリオを「花形」「金のなる木」などに分類し、資源配分を決める手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "EDI", desc: "企業間で受発注や請求などのビジネスデータを、専用回線やインターネットを介して電子的に直接交換する仕組み。" },
        { cat: "ストラテジ", cls: "tag-st", term: "BPR", desc: "企業の業務プロセスや組織構造を根本から見直し、コスト・品質・スピードを劇的に改善するビジネスプロセス再設計。" },
        { cat: "ストラテジ", cls: "tag-st", term: "クラウドファンディング", desc: "インターネットを通じて不特定多数の人から少額ずつ資金を調達する仕組み。" },
        { cat: "ストラテジ", cls: "tag-st", term: "クラウドソーシング", desc: "インターネットを通じて不特定多数の人に業務を発注・外部委託する仕組み。" },

        { question: "【ストラテジ】インターネット上で不特定多数の人々から少額ずつ資金を調達する仕組みを何と呼びますか？", choices: ["クラウドファンディング", "アウトソーシング", "クラウドソーシング", "シェアリングエコノミー"], correctIndex: 0, hint: "群衆（クラウド）から資金調達（ファンディング）する仕組みだよ。" },
        { question: "【ストラテジ】インターネットを通じて、不特定多数の人に業務（デザイン作成や記事執筆など）を発注する仕組みを何と呼びますか？", choices: ["クラウドソーシング", "クラウドファンディング", "テレワーク", "オフショア開発"], correctIndex: 0, hint: "群衆（クラウド）に業務を委託（ソーシング）する働き方だよ。" },
        { question: "【マネジメント】システム開発において、開発規模や工数、費用を見積もる際に、システムの機能数やデータの入出力数から規模を算出する手法はどれですか？", choices: ["ファンクションポイント法", "プログラムステップ法", "類推見積法", "ボトムアップ見積法"], correctIndex: 0, hint: "システムの「機能（ファンクション）」の数に重み付けをして点数化する見積もり手法だよ。" }
    ];

    let currentMode = 'normal';
    let playList = [];
    let currentQuizIndex = 0;
    let correctCount = 0;
    let testQuestions = [];

    // 用語集リスト描画
    function renderGlossary(filterText = "") {
        const container = document.getElementById("glossary-list-container");
        container.innerHTML = "";
        const keyword = filterText.toLowerCase();

        const filtered = glossaryData.filter(item => 
            item.term.toLowerCase().includes(keyword) || 
            item.desc.toLowerCase().includes(keyword) ||
            item.cat.includes(keyword)
        );

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">該当する用語が見つかりませんでした。</p>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement("div");
            div.className = "glossary-item";
            div.innerHTML = `
                <div class="glossary-term">
                    <span class="glossary-tag ${item.cls}">${item.cat}</span>
                    ${item.term}
                </div>
                <p class="glossary-desc">${item.desc}</p>
            `;
            container.appendChild(div);
        });
    }

    function filterGlossary() {
        const text = document.getElementById("input-glossary-search").value;
        renderGlossary(text);
    }

    function showStartScreen() {
        document.getElementById("screen-start").classList.remove("hidden");
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-test").classList.add("hidden");
        document.getElementById("screen-end").classList.add("hidden");
        window.scrollTo(0, 0);
    }

    function shuffleArray(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            let temp = copy[i];
            copy[i] = copy[j];
            copy[j] = temp;
        }
        return copy;
    }

    function startQuiz(mode) {
        currentMode = mode;
        currentQuizIndex = 0;
        correctCount = 0;
        
        let filteredList = quizList;

        if (mode === 'strategy') {
            filteredList = quizList.filter(q => q.question.includes("【ストラテジ】"));
            document.getElementById("lbl-mode-badge").textContent = "🏢 ストラテジ系";
        } else if (mode === 'management') {
            filteredList = quizList.filter(q => q.question.includes("【マネジメント】"));
            document.getElementById("lbl-mode-badge").textContent = "📊 マネジメント系";
        } else if (mode === 'technology') {
            filteredList = quizList.filter(q => q.question.includes("【テクノロジ】"));
            document.getElementById("lbl-mode-badge").textContent = "💻 テクノロジ系";
        } else if (mode === 'normal') {
            document.getElementById("lbl-mode-badge").textContent = "10問チャレンジ";
        } else {
            document.getElementById("lbl-mode-badge").textContent = "🔥 エンドレスモード";
        }

        const shuffled = shuffleArray(filteredList);

        if (mode === 'normal' || mode === 'strategy' || mode === 'management' || mode === 'technology') {
            playList = shuffled.slice(0, 10);
        } else {
            playList = shuffled;
        }

        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        document.getElementById("screen-test").classList.add("hidden");
        document.getElementById("screen-end").classList.add("hidden");

        showQuiz();
    }

    function showQuiz() {
        if (currentQuizIndex < playList.length) {
            const currentQuiz = playList[currentQuizIndex];
            
            if (currentMode === 'normal' || currentMode === 'strategy' || currentMode === 'management' || currentMode === 'technology') {
                document.getElementById("lbl-progress").textContent = `第 ${currentQuizIndex + 1} 問 / 全 ${playList.length} 問`;
            } else {
                document.getElementById("lbl-progress").textContent = `🔥 エンドレス（第 ${currentQuizIndex + 1} 問 / 正解数: ${correctCount}）`;
            }

            document.getElementById("lbl-question").textContent = currentQuiz.question;

            const hintBox = document.getElementById("lbl-hint");
            hintBox.textContent = "";
            hintBox.classList.add("hidden");

            const choiceButtons = document.querySelectorAll(".btn-choice");
            choiceButtons.forEach((button, index) => {
                button.textContent = `${index + 1}. ${currentQuiz.choices[index]}`;
                button.disabled = false;
                button.style.backgroundColor = "#ffffff";
                button.style.color = "#007bff";
            });

            document.getElementById("lbl-result").textContent = "";
            const btnNext = document.getElementById("btn-next");
            btnNext.disabled = true;
            btnNext.textContent = "次の問題へ";
        }
    }

    function showHint() {
        const currentQuiz = playList[currentQuizIndex];
        const hintBox = document.getElementById("lbl-hint");
        hintBox.textContent = `💡 ヒント: ${currentQuiz.hint}`;
        hintBox.classList.remove("hidden");
    }

    function selectChoice(selectedIndex) {
        const currentQuiz = playList[currentQuizIndex];
        const choiceButtons = document.querySelectorAll(".btn-choice");
        const btnNext = document.getElementById("btn-next");

        choiceButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQuiz.correctIndex) {
            document.getElementById("lbl-result").textContent = "⭕ 正解！素晴らしい！";
            document.getElementById("lbl-result").style.color = "#28a745";
            choiceButtons[selectedIndex].style.backgroundColor = "#28a745";
            choiceButtons[selectedIndex].style.color = "#ffffff";
            correctCount++;
        } else {
            document.getElementById("lbl-result").textContent = `❌ 残念！正解は ${currentQuiz.correctIndex + 1} です。`;
            document.getElementById("lbl-result").style.color = "#dc3545";
            choiceButtons[selectedIndex].style.backgroundColor = "#dc3545";
            choiceButtons[selectedIndex].style.color = "#ffffff";
            choiceButtons[currentQuiz.correctIndex].style.backgroundColor = "#28a745";
            choiceButtons[currentQuiz.correctIndex].style.color = "#ffffff";
        }

        btnNext.disabled = false;
    }

    function nextQuestion() {
        currentQuizIndex++;

        if (currentMode === 'endless' && currentQuizIndex >= playList.length) {
            playList = shuffleArray(quizList);
            currentQuizIndex = 0;
        }

        if (currentQuizIndex < playList.length) {
            showQuiz();
        } else {
            endQuizScreen();
        }
    }

    function endQuizScreen() {
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-end").classList.remove("hidden");

        document.getElementById("lbl-end-title").textContent = "クイズ終了！";
        document.getElementById("lbl-final-score").textContent = 
            `お疲れ様でした！\n\nあなたの成績：${playList.length}問中 ${correctCount}問 正解！`;
    }

    function startTestMode() {
        testQuestions = shuffleArray(quizList).slice(0, 10);
        const container = document.getElementById("test-questions-container");
        container.innerHTML = "";

        document.getElementById("test-result-area").classList.add("hidden");
        document.getElementById("test-result-area").innerHTML = "";
        document.getElementById("btn-submit-test").classList.remove("hidden");
        document.getElementById("btn-test-back").classList.add("hidden");
        document.getElementById("btn-test-quit").classList.remove("hidden");

        testQuestions.forEach((q, qIdx) => {
            const itemDiv = document.createElement("div");
            itemDiv.className = "test-item";
            itemDiv.id = `test-item-${qIdx}`;

            let choicesHtml = "";
            q.choices.forEach((choice, cIdx) => {
                choicesHtml += `
                    <label class="test-choice-label" id="test-label-${qIdx}-${cIdx}">
                        <input type="radio" name="test-q-${qIdx}" value="${cIdx}">
                        ${cIdx + 1}. ${choice}
                    </label>
                `;
            });

            itemDiv.innerHTML = `
                <div class="test-q-title">第 ${qIdx + 1} 問</div>
                <div class="test-q-text">${q.question}</div>
                <div>${choicesHtml}</div>
                <div id="test-fb-${qIdx}" class="test-feedback hidden"></div>
            `;
            container.appendChild(itemDiv);
        });

        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-test").classList.remove("hidden");
        document.getElementById("screen-end").classList.add("hidden");
        window.scrollTo(0, 0);
    }

    function gradeTestMode() {
        let unanswered = [];
        for (let i = 0; i < testQuestions.length; i++) {
            const selected = document.querySelector(`input[name="test-q-${i}"]:checked`);
            if (!selected) {
                unanswered.push(i + 1);
            }
        }

        if (unanswered.length > 0) {
            alert(`第 ${unanswered.join(", ")} 問が未回答です。すべての問題に回答してから採点してください。`);
            return;
        }

        let score = 0;
        testQuestions.forEach((q, qIdx) => {
            const selected = document.querySelector(`input[name="test-q-${qIdx}"]:checked`);
            const userAns = parseInt(selected.value, 10);
            const fbDiv = document.getElementById(`test-fb-${qIdx}`);

            const radios = document.querySelectorAll(`input[name="test-q-${qIdx}"]`);
            radios.forEach(r => r.disabled = true);

            if (userAns === q.correctIndex) {
                score++;
                fbDiv.textContent = `⭕ 正解！`;
                fbDiv.className = "test-feedback fb-correct";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.backgroundColor = "#d4edda";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.borderColor = "#28a745";
            } else {
                fbDiv.textContent = `❌ 不正解（正解は ${q.correctIndex + 1}. ${q.choices[q.correctIndex]}）`;
                fbDiv.className = "test-feedback fb-wrong";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.backgroundColor = "#f8d7da";
                document.getElementById(`test-label-${qIdx}-${userAns}`).style.borderColor = "#dc3545";
                document.getElementById(`test-label-${qIdx}-${q.correctIndex}`).style.backgroundColor = "#d4edda";
                document.getElementById(`test-label-${qIdx}-${q.correctIndex}`).style.borderColor = "#28a745";
            }
        });

        const resultArea = document.getElementById("test-result-area");
        const passMsg = score >= 6 ? "🎉 合格ライン（60%以上）達成！素晴らしい実力です！" : "📚 あと少し！間違えた問題を見直して再挑戦しよう！";
        resultArea.innerHTML = `
            <h2 style="margin:0 0 10px 0; color:#333;">採点結果：10問中 ${score} 問正解（${score * 10}点）</h2>
            <p style="margin:0; font-weight:bold; color:${score >= 6 ? '#28a745' : '#dc3545'};">${passMsg}</p>
        `;
        resultArea.classList.remove("hidden");

        document.getElementById("btn-submit-test").classList.add("hidden");
        document.getElementById("btn-test-back").classList.remove("hidden");
        document.getElementById("btn-test-quit").classList.add("hidden");

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openGlossary() {
        document.getElementById("input-glossary-search").value = "";
        renderGlossary();
        document.getElementById("modal-glossary").classList.remove("hidden");
    }

    function closeGlossary() {
        document.getElementById("modal-glossary").classList.add("hidden");
    }
</script>
