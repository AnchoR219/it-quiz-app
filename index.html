<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITパスポート クイズDX（大容量用語集付き）</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .progress {
            font-size: 14px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 16px;
            color: #2c3e50;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .choices-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-choice {
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #007bff;
            background-color: #ffffff;
            color: #007bff;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-choice:hover:not(:disabled) {
            background-color: #007bff;
            color: #ffffff;
        }

        .btn-choice:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-hint {
            background-color: #ffc107;
            color: #333;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn-hint:hover {
            background-color: #e0a800;
        }

        .hint-box {
            background-color: #fff9db;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            font-size: 14px;
            color: #856404;
            margin-bottom: 15px;
            border-radius: 4px;
            line-height: 1.5;
        }

        .result-message {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            min-height: 27px;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #28a745;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 10px;
        }

        .btn-action:hover {
            background-color: #218838;
        }

        .btn-action:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .btn-glossary-open {
            background-color: #6c757d;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        .btn-glossary-open:hover {
            background-color: #5a6268;
        }

        /* 用語集モーダル */
        .glossary-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .glossary-content {
            background-color: #ffffff;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .glossary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .glossary-header h2 {
            margin: 0;
            font-size: 20px;
            color: #333;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        /* 用語検索ボックス */
        .glossary-search {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
        }
        .glossary-search:focus {
            border-color: #007bff;
        }

        .glossary-list {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .glossary-item {
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f1f1f1;
        }

        .glossary-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            color: #fff;
        }
        .tag-st { background-color: #17a2b8; }
        .tag-mg { background-color: #fd7e14; }
        .tag-tc { background-color: #6f42c1; }

        .glossary-term {
            font-weight: bold;
            color: #007bff;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }

        .glossary-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin: 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <!-- タイトル画面 -->
    <div id="screen-start">
        <h1>ITパスポート クイズDX</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">
            初心者・未経験者でも安心！全35問すべてにヒント＆55語の大容量用語集付き。ランダムで10問出題されます。
        </p>
        <button class="btn-action" onclick="startQuiz()">クイズを始める</button>
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を見る（全55語）</button>
    </div>

    <!-- クイズ画面 -->
    <div id="screen-quiz" class="hidden">
        <div id="lbl-progress" class="progress">第 1 問 / 全 10 問</div>
        <div id="lbl-question" class="question-text"></div>
        
        <button class="btn-hint" onclick="showHint()">💡 ヒントを見る</button>
        <div id="lbl-hint" class="hint-box hidden"></div>

        <div class="choices-grid">
            <button class="btn-choice" onclick="selectChoice(0)"></button>
            <button class="btn-choice" onclick="selectChoice(1)"></button>
            <button class="btn-choice" onclick="selectChoice(2)"></button>
            <button class="btn-choice" onclick="selectChoice(3)"></button>
        </div>

        <div id="lbl-result" class="result-message"></div>
        <button id="btn-next" class="btn-action" onclick="nextQuestion()" disabled>次の問題へ</button>
        
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を開いて確認する</button>
    </div>

    <!-- 終了画面 -->
    <div id="screen-end" class="hidden">
        <h1>クイズ終了！</h1>
        <p id="lbl-final-score" class="question-text" style="text-align: center; font-size: 18px;"></p>
        <button class="btn-action" onclick="showStartScreen()">タイトルに戻る</button>
        <button class="btn-glossary-open" onclick="openGlossary()">📖 用語集を復習する</button>
    </div>
</div>

<!-- 用語集モーダルウィンドウ -->
<div id="modal-glossary" class="glossary-modal hidden">
    <div class="glossary-content">
        <div class="glossary-header">
            <h2>ITパスポート頻出 用語集（全55語）</h2>
            <button class="btn-close" onclick="closeGlossary()">×</button>
        </div>
        <input type="text" id="input-glossary-search" class="glossary-search" placeholder="🔍 キーワードで検索（例：セキュリティ、クラウド、AI...）" onkeyup="filterGlossary()">
        <div id="glossary-list-container" class="glossary-list"></div>
        <button class="btn-action" style="margin-top: 15px; margin-bottom: 0;" onclick="closeGlossary()">閉じる</button>
    </div>
</div>

<script>
    // 全55語の網羅的用語データ
    const glossaryData = [
        // ストラテジ系
        { cat: "ストラテジ", cls: "tag-st", term: "DX（デジタルトランスフォーメーション）", desc: "デジタル技術を活用して、ビジネスモデルや業務プロセス、組織文化などを根本から変革し、競争上の優位性を確立すること。" },
        { cat: "ストラテジ", cls: "tag-st", term: "BCP（事業継続計画）", desc: "自然災害やシステム障害などの緊急事態が発生した際、損害を最小限に抑えつつ中核事業を継続・早期復旧させるための事前計画。" },
        { cat: "ストラテジ", cls: "tag-st", term: "SWOT分析", desc: "自社の「強み(S)・弱み(W)」と外部環境の「機会(O)・脅威(T)」の4つの軸で現状を整理し、経営戦略を立てる分析手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "PDCAサイクル", desc: "Plan（計画）→ Do（実行）→ Check（評価）→ Act（改善）の4段階を繰り返し、業務を継続的に改善する手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "KPI / KGI", desc: "KGIは「重要目標達成指標（最終ゴール）」、KPIはそこに至るまでの過程を計測する「重要業績評価指標（中間目標）」のこと。" },
        { cat: "ストラテジ", cls: "tag-st", term: "ERP（企業資源計画）", desc: "会計・人事・生産・販売などの企業全体の経営資源（ヒト・モノ・カネ・情報）を一元管理し、経営効率を高める統合基幹業務システム。" },
        { cat: "ストラテジ", cls: "tag-st", term: "CRM（顧客関係管理）", desc: "顧客の属性や購買履歴などを管理・分析し、一人ひとりに最適な対応を行うことで顧客満足度やリピート率を高める手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "SCM（サプライチェーンマネジメント）", desc: "原材料の調達から製造、在庫管理、配送、販売までのモノの流れ全体を最適化し、コスト削減や納期短縮を図る経営手法。" },
        { cat: "ストラテジ", cls: "tag-st", term: "OEM", desc: "相手先ブランドによる生産のこと。他社ブランドの製品を製造すること、または自社で工場を持たず他社に製造を委託する形態。" },
        { cat: "ストラテジ", cls: "tag-st", term: "アウトソーシング", desc: "自社の業務やシステム運用などの一部を、外部の専門企業に委託すること。" },
        { cat: "ストラテジ", cls: "tag-st", term: "コーポレートガバナンス", desc: "企業経営の透明性や公正性を確保するために、株主や社外取締役などが経営陣を監視・統制する仕組み（企業統治）。" },
        { cat: "ストラテジ", cls: "tag-st", term: "内部統制", desc: "企業が法令を遵守し、業務の有効性・効率性を高め、不正やミスを防ぐために社内で構築・運用する管理・チェック体制。" },
        { cat: "ストラテジ", cls: "tag-st", term: "コンプライアンス", desc: "企業が法律や規則を守るだけでなく、社会的な倫理や道徳、社内ルールまで含めて遵守すること（法令遵守）。" },
        { cat: "ストラテジ", cls: "tag-st", term: "NDA（秘密保持契約）", desc: "ビジネスの取引や業務委託の際に、知り得た機密情報を第三者に漏らさないことを約束する契約。" },
        { cat: "ストラテジ", cls: "tag-st", term: "著作権", desc: "小説、イラスト、音楽、プログラムなどの著作物を創作した人が持つ権利。無断での複製・改変・公開を禁止します。" },
        { cat: "ストラテジ", cls: "tag-st", term: "特許権 / 商標権 / 意匠権", desc: "特許権は「高度な発明」、商標権は「商品名やロゴマーク」、意匠権は「製品のデザイン・外観」を保護する知的財産権。" },
        { cat: "ストラテジ", cls: "tag-st", term: "個人情報保護法", desc: "氏名・住所・マイナンバーなど個人を特定できる情報の適正な取り扱いを企業などに義務づけた日本の法律。" },
        { cat: "ストラテジ", cls: "tag-st", term: "不正アクセス禁止法", desc: "他人のID・パスワードを無断で使ったり、セキュリティの穴を突いてコンピュータに侵入したりする行為を罰する法律。" },
        { cat: "ストラテジ", cls: "tag-st", term: "プライバシーマーク（Pマーク）", desc: "個人情報の保護体制が適切に整備されていると評価された事業者に付与される認証マーク。" },
        { cat: "ストラテジ", cls: "tag-st", term: "グリーンIT", desc: "省エネ性能の高い機器の導入やペーパーレス化など、地球環境への負荷を減らすITの設計・活用。" },
        { cat: "ストラテジ", cls: "tag-st", term: "フィンテック（FinTech）", desc: "金融（Finance）と技術（Technology）を融合させた、スマホ決済や家計簿アプリ、仮想通貨などの新しい金融サービス。" },
        { cat: "ストラテジ", cls: "tag-st", term: "サブスクリプション", desc: "製品を買い切るのではなく、利用期間に応じて定額料金を支払うビジネスモデル（動画配信やクラウドソフトなど）。" },

        // マネジメント系
        { cat: "マネジメント", cls: "tag-mg", term: "ウォーターフォールモデル", desc: "要件定義→設計→開発→テストと、上流工程から下流工程へ滝が流れるように順番に完了させながら進める伝統的な開発手法。" },
        { cat: "マネジメント", cls: "tag-mg", term: "アジャイル開発", desc: "「計画・設計・実装・テスト」の短いサイクルを何度も繰り返し、機能単位で素早くリリースしながら柔軟に進める開発手法。" },
        { cat: "マネジメント", cls: "tag-mg", term: "RFP（提案依頼書）", desc: "システムを発注する企業が、ITベンダー（開発会社）に対して「こんなシステムを作りたいので提案書や見積もりをください」と依頼する文書。" },
        { cat: "マネジメント", cls: "tag-mg", term: "SLA（サービスレベル合意書）", desc: "ITサービスの提供者と利用者の間で、サービスの品質（稼働率99.9%以上など）や保証範囲を具体的に取り決めた合意書。" },
        { cat: "マネジメント", cls: "tag-mg", term: "WBS（作業分解構成図）", desc: "プロジェクト全体の作業を細かく分解し、ツリー状（階層構造）に整理してスケジュールや担当を管理しやすくする手法。" },
        { cat: "マネジメント", cls: "tag-mg", term: "クリティカルパス", desc: "プロジェクトの作業経路の中で「最も時間がかかるルート」のこと。この経路上の作業が遅れると全体の納期も遅れます。" },
        { cat: "マネジメント", cls: "tag-mg", term: "ガントチャート", desc: "縦軸に作業項目、横軸に日程をとり、各作業の予定と進捗状況を横棒グラフで表したスケジュール管理表。" },
        { cat: "マネジメント", cls: "tag-mg", term: "ITIL（アイティル）", desc: "ITサービスの運用・管理におけるベストプラクティス（成功事例やノウハウ）を体系的にまとめたガイドライン。" },
        { cat: "マネジメント", cls: "tag-mg", term: "サービスデスク", desc: "システムの利用者からの問い合わせやトラブル報告を一元的に受け付け、対応・案内を行う単一窓口。" },
        { cat: "マネジメント", cls: "tag-mg", term: "単体テスト / 結合テスト / 総合テスト", desc: "単体はプログラム部品ごとのテスト、結合は部品同士をつないだテスト、総合は本番と同じ環境でシステム全体を検証するテスト。" },
        { cat: "マネジメント", cls: "tag-mg", term: "システム監査", desc: "情報システムが安全・効率的に運用されているかを、独立した専門家が客観的に点検・評価し、改善を助言すること。" },

        // テクノロジ系
        { cat: "テクノロジ", cls: "tag-tc", term: "機密性・完全性・可用性（CIA）", desc: "情報セキュリティの3大要素。機密性は「許可された人だけ見られる」、完全性は「改ざんされていない」、可用性は「使いたい時にいつでも使える」こと。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "ランサムウェア", desc: "パソコン内のデータを勝手に暗号化して使えなくし、元に戻す引き換えに「身代金」を要求する悪質なマルウェア（ウイルス）。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "フィッシング詐欺", desc: "実在する銀行や通販サイトなどを装った偽メールを送りつけ、偽サイトへ誘導してID・パスワードやカード番号を盗み取る手口。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "ソーシャルエンジニアリング", desc: "技術的な攻撃ではなく、人間の心理的な隙や不注意を突いて（肩越しに画面を覗く、電話で聞き出すなど）秘密情報を盗む手法。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "二要素認証 / 多要素認証", desc: "パスワード（知識）だけでなく、スマホのSMS認証（所持）や指紋認証（生体）など、異なる種類の認証要素を組み合わせて安全性を高める仕組み。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "ファイアウォール", desc: "社内ネットワークとインターネットの境界に設置し、不正なアクセスや怪しい通信を遮断する「防火壁」の役割を持つ仕組み。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "SSL/TLS", desc: "インターネット上の通信を暗号化し、盗聴や改ざんを防ぐ仕組み。WebサイトのURLが「https://」で始まる場合はこれが使われています。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "VPN（仮想私設網）", desc: "インターネット上に仮想の専用線を作り、通信を暗号化することで、外出先や自宅からでも安全に社内ネットワークへ接続できる技術。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "IPアドレス", desc: "インターネットやネットワークに接続されたコンピュータやスマホに割り当てられる「ネット上の住所」にあたる識別番号。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "DNS（ドメインネームシステム）", desc: "「example.com」のような人間が覚えやすいドメイン名と、コンピュータが扱う「IPアドレス」を相互に変換する仕組み。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "Wi-Fi（無線LAN）", desc: "LANケーブルを使わず、電波によってパソコンやスマホをネットワークに無線接続する技術。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "CPU（中央処理装置）", desc: "コンピュータの「頭脳」にあたり、プログラムの命令を読み取って計算（演算）や各装置の制御を行う中心パーツ。" },
        { cat: "テクノロジ", cls: "tag-tc", term: "RAM / ROM", desc: "RAMは作業机の役割をする高速なメモリ（電源を切ると消える）。ROMは読み出し専用で電源を切っても消えないメモリ。" },

    // 用語集リストを初期描画
    function renderGlossary(filterText = "") {
        const container = document.getElementById("glossary-list-container");
        container.innerHTML = "";
        const keyword = filterText.toLowerCase();

        const filtered = glossaryData.filter(item => 
            item.term.toLowerCase().includes(keyword) || 
            item.desc.toLowerCase().includes(keyword) ||
            item.cat.includes(keyword)
        );

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#888; margin-top:20px;">該当する用語が見つかりませんでした。</p>`;
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement("div");
            div.className = "glossary-item";
            div.innerHTML = `
                <div class="glossary-term">
                    <span class="glossary-tag ${item.cls}">${item.cat}</span>
                    ${item.term}
                </div>
                <p class="glossary-desc">${item.desc}</p>
            `;
            container.appendChild(div);
        });
    }

    function filterGlossary() {
        const text = document.getElementById("input-glossary-search").value;
        renderGlossary(text);
    }

    function showStartScreen() {
        document.getElementById("screen-start").classList.remove("hidden");
        document.getElementById("screen-quiz").classList.add("hidden");
        document.getElementById("screen-end").classList.add("hidden");
    }

    function startQuiz() {
        currentQuizIndex = 0;
        correctCount = 0;
        
        shuffleArray(quizList);
        playList = quizList.slice(0, 10);

        document.getElementById("screen-start").classList.add("hidden");
        document.getElementById("screen-quiz").classList.remove("hidden");
        document.getElementById("screen-end").classList.add("hidden");

        showQuiz();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            let temp = array[i];
            array[i] = array[j];
            array[j] = temp;
        }
    }

    function showQuiz() {
        if (currentQuizIndex < playList.length) {
            const currentQuiz = playList[currentQuizIndex];
            
            document.getElementById("lbl-progress").textContent = `第 ${currentQuizIndex + 1} 問 / 全 ${playList.length} 問`;
            document.getElementById("lbl-question").textContent = currentQuiz.question;

            const hintBox = document.getElementById("lbl-hint");
            hintBox.textContent = "";
            hintBox.classList.add("hidden");

            const choiceButtons = document.querySelectorAll(".btn-choice");
            choiceButtons.forEach((button, index) => {
                button.textContent = `${index + 1}. ${currentQuiz.choices[index]}`;
                button.disabled = false;
                button.style.backgroundColor = "#ffffff";
                button.style.color = "#007bff";
            });

            document.getElementById("lbl-result").textContent = "";
            document.getElementById("btn-next").disabled = true;
        }
    }

    function showHint() {
        const currentQuiz = playList[currentQuizIndex];
        const hintBox = document.getElementById("lbl-hint");
        hintBox.textContent = `💡 ヒント: ${currentQuiz.hint}`;
        hintBox.classList.remove("hidden");
    }

    function selectChoice(selectedIndex) {
        const currentQuiz = playList[currentQuizIndex];
        const choiceButtons = document.querySelectorAll(".btn-choice");

        choiceButtons.forEach(btn => btn.disabled = true);

        if (selectedIndex === currentQuiz.correctIndex) {
            document.getElementById("lbl-result").textContent = "⭕ 正解！素晴らしい！";
            document.getElementById("lbl-result").style.color = "#28a745";
            choiceButtons[selectedIndex].style.backgroundColor = "#28a745";
            choiceButtons[selectedIndex].style.color = "#ffffff";
            correctCount++;
        } else {
            document.getElementById("lbl-result").textContent = `❌ 残念！正解は ${currentQuiz.correctIndex + 1} です。`;
            document.getElementById("lbl-result").style.color = "#dc3545";
            choiceButtons[selectedIndex].style.backgroundColor = "#dc3545";
            choiceButtons[selectedIndex].style.color = "#ffffff";
        }

        document.getElementById("btn-next").disabled = false;
    }

    function nextQuestion() {
        currentQuizIndex++;

        if (currentQuizIndex < playList.length) {
            showQuiz();
        } else {
            document.getElementById("screen-quiz").classList.add("hidden");
            document.getElementById("screen-end").classList.remove("hidden");
            document.getElementById("lbl-final-score").textContent = 
                `お疲れ様でした！\n\nあなたの成績：${playList.length}問中 ${correctCount}問 正解！`;
        }
    }

    function openGlossary() {
        document.getElementById("input-glossary-search").value = "";
        renderGlossary();
        document.getElementById("modal-glossary").classList.remove("hidden");
    }

    function closeGlossary() {
        document.getElementById("modal-glossary").classList.add("hidden");
    }
</script>

</body>
</html>
